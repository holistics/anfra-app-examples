    function closeDrawer () {
      S.drawer = null;
      renderNow();
      if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
      returnFocus = null;
    }

    // ---- Render loop ----

    const logged = new Set();
    function logFirst (x) {
      if (x.state !== 'success' || logged.has(x.name)) return;
      logged.add(x.name);
      console.log(x.name, 'columns', x.result.columns, 'first row', x.result.rows[0], 'executed AQL', x.result.debug && x.result.debug.executedAql);
    }

    function renderNow () {
      pending = false;
      logFirst(bounds);
      if (!Q) {
        const boot = $('boot');
        boot.classList.toggle('error', bounds.state === 'error');
        if (bounds.state === 'error') boot.innerHTML = errorHtml(bounds.error);
        else if (bounds.state === 'success' && !S.today) boot.innerHTML = '<p>The usage log has no events yet.</p>';
        else boot.innerHTML = '<p>Loading…</p>';
        return;
      }
      for (const k of Object.keys(Q)) if (Q[k].result !== undefined || Q[k].state) logFirst(Q[k]);
      for (const k of Object.keys(DQ)) DQ[k].all.forEach(logFirst);
      renderHeader();
      paintGlyph();
      renderOverview(); renderDashboards(); renderNoViews();
      renderMetrics();
      renderPeople();
      renderDrawer();
    }

    let pending = false;
    function schedule () {
      if (pending) return;
      pending = true;
      setTimeout(renderNow, 0);
    }

    // Runs on every update until the log's bounds arrive, then declares the rest once.
    // Each createFilter/createQuery call inside declare() notifies subscribers synchronously,
    // re-entering boot() before Q is assigned — declaring guards against that re-entrant declare().
    let declaring = false;
    function boot () {
      if (Q || declaring || bounds.state !== 'success') return;
      const row = one(bounds);
      S.today = L.day(row.last_at);
      S.logStart = L.day(row.first_at);
      if (!S.today) { renderNow(); return; }
      declaring = true;
      declare();
      setRange(S.range);
      $('boot').hidden = true;
      $('main').hidden = false;
      for (const m of TREND) {
        const el = $('trendCard-' + m.key).querySelector('.chart'), chart = echarts.init(el);
        trendCharts[m.key] = chart;
        new ResizeObserver(() => { if (el.clientWidth) chart.resize(); }).observe(el);   // the card was resized
      }
      renderNow();
      app.execute();
    }

    // ---- Title style ----
    // A Tweak (see the data-edit-mode-tweaks script): Edit mode sets data-tweak-titlestyle on <html>.

    const hero = document.querySelector('.hero');

    function renderTitle () {
      const glyph = document.documentElement.dataset.tweakTitlestyle === 'glyph';
      hero.querySelector(':scope > span').innerHTML = 'Usage ' + (glyph ? 'analyt<span class="glyph" aria-hidden="true"><i></i><i></i><i></i></span>cs' : 'analytics');
      hero.setAttribute('aria-label', 'Usage analytics');
      paintGlyph();
    }

    // The three bars are the last three periods of the views trend, scaled against the last six.
    function paintGlyph () {
      const bars = hero.querySelectorAll('.glyph i');
      if (!bars.length) return;
      const vals = rows(Q && Q.trend).slice().sort((a, b) => String(a.period).localeCompare(String(b.period))).map((r) => L.num(r.n_views) || 0).slice(-6);
      const last = vals.slice(-3);
      const max = Math.max(1, ...vals);
      bars.forEach((el, i) => { el.style.height = (last.length === 3 ? Math.max(18, Math.round(last[i] / max * 100)) : [45, 70, 100][i]) + '%'; });
    }

    new MutationObserver(renderTitle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tweak-titlestyle'] });
    renderTitle();


    // ---- Resizable cards ----
    // Drag the handle in a card's corner to set its height and width (the width can shrink from the column's width, not outgrow it).
    // Arrow keys move it when focused, a double-click puts the card back.
    const RZ_MIN_H = 160, RZ_MIN_W = 280;
    document.querySelectorAll('.card:not(.views-wide):not(#peopleKpiCard)').forEach((card) => {
      const h = document.createElement('button');
      h.type = 'button'; h.className = 'rz';
      h.title = 'Drag to resize, double-click to reset';
      h.setAttribute('aria-label', `Resize ${card.dataset.anfraLabel || 'card'}`);
      h.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M9 2 2 9M9 6 6 9"/></svg>';
      card.appendChild(h);

      const size = (w, ht) => {
        card.classList.add('sized');
        if (w !== null) card.style.width = w + 'px';
        card.style.height = Math.max(RZ_MIN_H, ht) + 'px';
      };
      // The width the layout gives this card, measured with our own width taken off.
      const columnW = () => { const w0 = card.style.width; card.style.width = ''; const w = card.getBoundingClientRect().width; card.style.width = w0; return w; };
      let from = null;
      h.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        h.setPointerCapture(e.pointerId); h.classList.add('drag');
        const r = card.getBoundingClientRect();
        from = { x: e.clientX, y: e.clientY, w: r.width, h: r.height, max: columnW() };
      });
      h.addEventListener('pointermove', (e) => {
        if (!from) return;
        const fit = (v) => Math.min(from.max, Math.max(RZ_MIN_W, v));
        let w = fit(from.w + e.clientX - from.x);
        // Layout grid on: the right edge snaps to a column edge when one is near (Alt skips it). A snap the column's limits would undo is not shown.
        const r = card.getBoundingClientRect();
        const hit = window.GridCanvas && window.GridCanvas.snapX([r.left + w], { y: r.top, off: e.altKey });
        if (hit && Math.abs(fit(w + hit.delta) - (w + hit.delta)) < 0.01) w = w + hit.delta;
        else if (hit) window.GridCanvas.clear();
        size(hit ? Math.round(w * 100) / 100 : Math.round(w), Math.round(from.h + e.clientY - from.y));
      });
      const end = (e) => { from = null; h.classList.remove('drag'); if (window.GridCanvas) window.GridCanvas.clear(); if (h.hasPointerCapture(e.pointerId)) h.releasePointerCapture(e.pointerId); layoutHistory.commit(); };
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
      h.addEventListener('dblclick', () => { card.classList.remove('sized'); card.style.width = card.style.height = ''; layoutHistory.commit(); });

      h.addEventListener('keydown', (e) => {
        const step = e.shiftKey ? 80 : 20, dy = e.key === 'ArrowDown' ? step : e.key === 'ArrowUp' ? -step : 0;
        if (!dy) return;
        e.preventDefault();
        size(null, Math.round(card.getBoundingClientRect().height + dy));
        layoutHistory.commit();
      });
    });

    // ---- Moving cards, tiles and the title ----
    // One grip serves every block: hover one and the grip sits on its top edge. Drag it anywhere on the canvas; double-click puts the block back,
    // arrow keys nudge it once the grip is clicked (Shift: 50px). With the layout grid on and "Snap to grid" set, the block's left and right edges snap to
    // column edges and a guide line shows which. Two more Layout grid switches (both on): "Prioritize non-overlap" settles a block that lands on another
    // in the nearest free spot (within NEAR px), and "Smart shifting" slides the blocks it still covers out of the way (they slide back if it moves off).
    // Alt skips all of it. Positions are kept per block while the page is open, and tiles get theirs back after a re-render.
    const MOVABLE = '.tile, .card, .ttl, .wave', NEAR = 48;
    const offsets = new Map();   // block key -> { x, y } in px from where the layout put it
    const cardKey = (c) => c.id || c.dataset.anfraLabel || 'card';
    const keyOf = (el) => {
      if (el.classList.contains('card')) return cardKey(el);
      if (el.classList.contains('tile')) { const c = el.closest('.card'); return `${c ? cardKey(c) : ''}#${(el.querySelector('.lbl') || el).textContent.trim()}`; }
      return el.dataset.moveLabel || 'block';
    };
    // Blocks that can collide with each other: tiles of one card, or cards and the title that share a parent card.
    const levelOf = (el) => {
      const c = (el.classList.contains('card') ? el.parentElement : el).closest('.card');
      if (el.classList.contains('wave')) return 'layer';   // a background layer: it collides with nothing and nothing slides for it
      return (el.classList.contains('tile') ? 'tile:' : 'block:') + (c ? cardKey(c) : '');
    };
    const apply = (el, p) => { el.style.translate = p.x || p.y ? `${p.x}px ${p.y}px` : ''; el.classList.toggle('moved', !!(p.x || p.y)); };
    const grip = document.createElement('button');
    grip.type = 'button'; grip.className = 'mv'; grip.title = 'Drag to move, double-click to put back';
    grip.innerHTML = '<svg viewBox="0 0 14 8" fill="currentColor" aria-hidden="true"><circle cx="3" cy="2" r="1"/><circle cx="7" cy="2" r="1"/><circle cx="11" cy="2" r="1"/><circle cx="3" cy="6" r="1"/><circle cx="7" cy="6" r="1"/><circle cx="11" cy="6" r="1"/></svg>';
    document.body.appendChild(grip);
    let target = null, drag = null;
    let reachWave = () => {};   // keeps the wave's resize handle on screen; set up with the wave below
    const park = () => {
      if (!target || !target.isConnected) { grip.classList.remove('on'); target = null; return; }
      const r = target.getBoundingClientRect(), tile = !target.classList.contains('card'), layer = target.classList.contains('wave');
      // The wave's grip sits in its top-left corner: the centre is the title's, and the wave has to be reachable without crossing it.
      grip.style.left = (layer ? Math.max(r.left, 0) + scrollX + 12 : r.left + scrollX + r.width / 2 - 14) + 'px';
      grip.style.top = r.top + scrollY + (layer ? 8 : tile ? -7 : 6) + 'px';
      if (layer) reachWave();
      grip.classList.add('on');
      grip.setAttribute('aria-label', `Move ${target.dataset.moveLabel || target.dataset.anfraLabel || (target.querySelector('.lbl') || {}).textContent || 'block'}`);
    };
    const hold = (el) => { if (drag || el === target) return; target = el; park(); };
    document.addEventListener('pointerover', (e) => {
      if (drag || grip.contains(e.target)) return;
      const el = e.target.closest && e.target.closest(MOVABLE);
      if (el) hold(el);
    });
    document.addEventListener('pointerout', (e) => {
      if (drag || !target || document.activeElement === grip) return;
      const into = e.relatedTarget;
      if (!into || !(grip.contains(into) || (into.closest && into.closest(MOVABLE)))) { target = null; park(); }
    });
    addEventListener('scroll', park, { passive: true });
    addEventListener('resize', park);
    const pos = () => offsets.get(keyOf(target)) || { x: 0, y: 0 };
    const place = (x, y) => { offsets.set(keyOf(target), { x, y }); apply(target, { x, y }); park(); };
    // A move starts here: the block's rect and the rects of the blocks it can collide with, as they are now.
    const begin = (el) => {
      const lv = levelOf(el);
      const peers = [...document.querySelectorAll(MOVABLE)]
        .filter((p) => p !== el && !p.contains(el) && !el.contains(p) && levelOf(p) === lv)
        .map((p) => ({ el: p, key: keyOf(p), rect: p.getBoundingClientRect(), base: offsets.get(keyOf(p)) || { x: 0, y: 0 } }))
        .map((p) => ({ ...p, now: p.base }))
        .filter((p) => p.rect.width && p.rect.height);
      return { rect: el.getBoundingClientRect(), peers };
    };
    // Where a move of (dx, dy) ends up once the Layout grid's switches have had their say. Moves the blocks that have to slide aside as a side effect.
    const settle = (s, dx, dy, alt) => {
      const cfg = (window.GridCanvas && window.GridCanvas.settings()) || {}, P = window.PlaceLogic;
      const at = (x, y) => ({ left: s.rect.left + x, right: s.rect.right + x, top: s.rect.top + y, bottom: s.rect.bottom + y });
      const rects = s.peers.map((p) => p.rect);
      let shifts = {};
      if (P && !alt) {
        if (cfg.avoid) {
          const f = P.nearestFree(at(dx, dy), rects, NEAR);
          if (f) { dx += f.dx; dy += f.dy; if (f.dx && window.GridCanvas) window.GridCanvas.clear(); }
        }
        if (cfg.shift) {
          const cv = (document.querySelector('[data-grid-canvas]') || document.body).getBoundingClientRect();
          shifts = P.push(at(dx, dy), rects, P.GAP, { left: cv.left, right: cv.right });
        }
      }
      s.peers.forEach((p, i) => {
        const sh = shifts[i] || { dx: 0, dy: 0 }, x = Math.round((p.base.x + sh.dx) * 100) / 100, y = Math.round((p.base.y + sh.dy) * 100) / 100;
        if (x === p.now.x && y === p.now.y) return;
        p.now = { x, y };
        if (x || y) offsets.set(p.key, { x, y }); else offsets.delete(p.key);
        apply(p.el, { x, y });
      });
      return { dx, dy };
    };
    grip.addEventListener('pointerdown', (e) => {
      if (!target) return;
      e.preventDefault();
      grip.setPointerCapture(e.pointerId); grip.classList.add('drag'); target.classList.add('moving'); grip.focus({ preventScroll: true });
      const s = begin(target);
      drag = { x: e.clientX, y: e.clientY, from: pos(), rect: s.rect, s, el: target };
    });
    grip.addEventListener('pointermove', (e) => {
      if (!drag) return;
      let dx = e.clientX - drag.x;
      const dy = e.clientY - drag.y, r = drag.rect;
      const hit = window.GridCanvas && window.GridCanvas.snapX([r.left + dx, r.right + dx], { y: r.top + dy, off: e.altKey });
      if (hit) dx += hit.delta;
      const end = settle(drag.s, dx, dy, e.altKey);
      place(Math.round((drag.from.x + end.dx) * 100) / 100, Math.round(drag.from.y + end.dy));
    });
    const drop = (e) => {
      if (!drag) return;
      drag.el.classList.remove('moving'); drag = null; grip.classList.remove('drag');
      if (window.GridCanvas) window.GridCanvas.clear();
      if (grip.hasPointerCapture(e.pointerId)) grip.releasePointerCapture(e.pointerId);

    };
    grip.addEventListener('pointerup', drop);
    grip.addEventListener('pointercancel', drop);
    grip.addEventListener('dblclick', () => { if (target) { offsets.delete(keyOf(target)); apply(target, { x: 0, y: 0 }); park(); layoutHistory.commit(); } });
    grip.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 50 : 10;
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!d || !target) return;
      e.preventDefault();
      const p = pos(), end = settle(begin(target), d[0], d[1], e.altKey);
      place(p.x + end.dx, p.y + end.dy);
      layoutHistory.commit();
    });
    grip.addEventListener('blur', () => { if (!drag && !grip.matches(':hover') && !(target && target.matches(':hover'))) { target = null; park(); } });
    // Tiles are rebuilt on every render; put each one back where it was left.
    new MutationObserver(() => {
      if (!offsets.size) return;
      document.querySelectorAll('.tile').forEach((el) => { const p = offsets.get(keyOf(el)); if (p && !el.style.translate) apply(el, p); });
      if (target && !target.isConnected) { target = null; park(); }
    }).observe(document.getElementById('main'), { childList: true, subtree: true });

    // ---- The wave: a layer of its own ----
    // Move it with its grip (top-left corner); the handle in its bottom-right corner sets its width and height, and the right edge snaps to
    // the layout grid like a card's. Double-click the handle to put the size back.
    const wave = document.querySelector('.hero .wave');
    {
      const WV_MIN = 80;
      const h = document.createElement('button');
      h.type = 'button'; h.className = 'rz';
      h.title = 'Drag to resize, double-click to reset';
      h.setAttribute('aria-label', 'Resize Wave');
      h.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M9 2 2 9M9 6 6 9"/></svg>';
      wave.appendChild(h);
      const size = (w, ht) => {
        wave.style.width = Math.max(WV_MIN, w) + 'px'; wave.style.height = Math.max(WV_MIN, ht) + 'px';
        reachWave();
        if (target === wave) park();
      };
      // The wave is as wide as the window, so once it is moved right its corner leaves the screen: keep the handle on screen.
      reachWave = () => { h.style.right = Math.max(6, wave.getBoundingClientRect().right - innerWidth + 6) + 'px'; };
      wave.addEventListener('pointerenter', reachWave);
      let from = null;
      h.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        h.setPointerCapture(e.pointerId); h.classList.add('drag');
        const r = wave.getBoundingClientRect();
        from = { x: e.clientX, y: e.clientY, w: r.width, h: r.height };
      });
      h.addEventListener('pointermove', (e) => {
        if (!from) return;
        let w = Math.max(WV_MIN, from.w + e.clientX - from.x);
        const r = wave.getBoundingClientRect();
        const hit = window.GridCanvas && window.GridCanvas.snapX([r.left + w], { y: r.top, off: e.altKey });
        if (hit) w += hit.delta;
        size(hit ? Math.round(w * 100) / 100 : Math.round(w), Math.round(from.h + e.clientY - from.y));
      });
      const end = (e) => { if (!from) return; from = null; h.classList.remove('drag'); if (window.GridCanvas) window.GridCanvas.clear(); if (h.hasPointerCapture(e.pointerId)) h.releasePointerCapture(e.pointerId); layoutHistory.commit(); };
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
      h.addEventListener('dblclick', () => { wave.style.width = wave.style.height = ''; if (target === wave) park(); layoutHistory.commit(); });
      h.addEventListener('keydown', (e) => {
        const step = e.shiftKey ? 80 : 20, r = wave.getBoundingClientRect();
        const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        if (!d) return;
        e.preventDefault();
        size(Math.round(r.width + d[0]), Math.round(r.height + d[1]));
        layoutHistory.commit();
      });
    }

    // ---- Undo and redo ----
    // Every move, nudge, resize and reset is one step. A step is the whole layout (every block's offset, every resized card, the wave's size),
    // so blocks that slid aside for a move go back with it. Cmd/Ctrl+Z undoes, Cmd+Shift+Z or Ctrl+Y redoes. The layout grid's own settings are not part of it.
    // Save (top right, where Edit was) saves the layout in this browser and the page opens with it next time; a layout that is back to the default is not kept.
    // location.pathname is "srcdoc" when a host page frames the app, so the file name is what tells apps apart.
    const APP_FILE = 'apps/usage-xray.html';
    const layoutHistory = (() => {
      const snapshot = () => JSON.stringify({
        off: [...offsets].map(([k, p]) => [k, p.x, p.y]).sort(),
        size: [...document.querySelectorAll('.card.sized')].map((c) => [cardKey(c), c.style.width, c.style.height]).sort(),
        wave: [wave.style.width, wave.style.height],
        del: [...document.querySelectorAll('.blk-del')].map((el) => el.dataset.anfraBlock).sort(),
      });
      const restore = (raw, quiet) => {
        const st = JSON.parse(raw), sized = new Map(st.size.map(([k, w, ht]) => [k, [w, ht]]));
        offsets.clear();
        st.off.forEach(([k, x, y]) => offsets.set(k, { x, y }));
        document.querySelectorAll(MOVABLE).forEach((el) => apply(el, offsets.get(keyOf(el)) || { x: 0, y: 0 }));
        document.querySelectorAll('.card').forEach((c) => {
          const z = sized.get(cardKey(c));
          if (!z && !c.classList.contains('sized')) return;
          c.classList.toggle('sized', !!z);
          c.style.width = z ? z[0] : ''; c.style.height = z ? z[1] : '';
        });
        wave.style.width = st.wave[0]; wave.style.height = st.wave[1];
        const gone = new Set(st.del || []);
        document.querySelectorAll('.shell [data-anfra-block]').forEach((el) => el.classList.toggle('blk-del', gone.has(el.dataset.anfraBlock)));
        if (!quiet) select(null);
        park();
      };
      const past = [], future = [];
      const store = (() => { try { localStorage.setItem('lay-probe', '1'); localStorage.removeItem('lay-probe'); return localStorage; } catch (e) { return null; } })();
      const SAVED = 'lay-saved:one-page:' + APP_FILE;
      const blank = snapshot();
      try { const raw = store && store.getItem(SAVED); if (raw) restore(raw, true); } catch (e) {}
      let now = snapshot();
      const icon = (d) => `<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
      const button = (label, key, d) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'gbtn hx';
        b.setAttribute('aria-label', label); b.title = label; b.dataset.tip = label; b.dataset.key = key;
        b.innerHTML = icon(d);
        return b;
      };
      const undoB = button('Undo', 'Z', 'M3 7h7a3.5 3.5 0 0 1 0 7H6M3 7l3-3M3 7l3 3');
      const redoB = button('Redo', '⇧Z', 'M13 7H6a3.5 3.5 0 0 0 0 7h4M13 7l-3-3M13 7l-3 3');
      const sync = () => { undoB.disabled = !past.length; redoB.disabled = !future.length; };
      const api = {
        commit () {
          const s = snapshot();
          if (s === now) return;
          past.push(now); future.length = 0; now = s;
          if (past.length > 100) past.shift();
          sync();
        },
        undo () { if (!past.length) return; future.push(now); now = past.pop(); restore(now); sync(); },
        redo () { if (!future.length) return; past.push(now); now = future.pop(); restore(now); sync(); },
        save () {
          try { if (now === blank) store && store.removeItem(SAVED); else store && store.setItem(SAVED, now); } catch (e) {}
        },
      };
      undoB.addEventListener('click', api.undo);
      redoB.addEventListener('click', api.redo);
      document.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k !== 'z' && k !== 'y') return;
        const el = e.composedPath()[0];
        if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
        e.preventDefault();
        if (k === 'y' || e.shiftKey) api.redo(); else api.undo();
      });
      // Next to the Grid button: in the edit-mode bar when it is there, otherwise a small floating pair beside it.
      addEventListener('load', () => {
        const bar = window.EditModeBar;
        if (bar && bar.slot) { bar.slot.append(undoB, redoB); return; }
        const box = document.createElement('div');
        box.className = 'hx-box';
        box.append(undoB, redoB);
        document.body.appendChild(box);
      });
      sync();
      return api;
    })();

    // ---- View and edit mode, selecting and deleting blocks ----
    // The page opens in view mode. Edit (top right) switches to edit mode: the edit-mode bar (Edit | Feedback | Tweaks), the move and resize handles, and
    // selecting blocks. A click anywhere in a block selects it instead of using it (the section nav and range buttons still work).
    // Right-click a block, or press Delete or Backspace with one selected, to delete it; undo (Cmd/Ctrl+Z) brings it back. While the edit-mode bar is in
    // its own Edit or Feedback mode, it picks the elements and this stays out of the way.
    const root = document.documentElement, editBtn = $('editBtn');
    const inEdit = () => root.dataset.dashMode === 'edit';
    const barBusy = () => { const b = window.EditModeBar; return !!(b && b.mode && b.mode() !== 'off'); };
    const blockOf = (node) => {
      const b = node && node.closest && node.closest('.shell [data-anfra-block]');
      return b && !b.classList.contains('blk-del') ? b : null;
    };
    let selected = null, hovered = null;
    function select (el) {
      if (selected) selected.classList.remove('blk-sel');
      selected = el;
      if (el) el.classList.add('blk-sel');
    }
    function hover (el) {
      if (hovered) hovered.classList.remove('blk-hover');
      hovered = el;
      if (el) el.classList.add('blk-hover');
    }
    const blockMenu = document.createElement('div');
    blockMenu.className = 'blk-menu'; blockMenu.hidden = true;
    blockMenu.setAttribute('role', 'menu');
    document.body.appendChild(blockMenu);
    const closeBlockMenu = () => { blockMenu.hidden = true; };
    function deleteBlock (el) {
      if (!el) return;
      el.classList.add('blk-del');
      if (el === selected) select(null);
      hover(null);
      closeBlockMenu();
      park();
      layoutHistory.commit();
    }
    function openBlockMenu (el, x, y) {
      blockMenu.innerHTML = `<div class="name">${esc(el.dataset.anfraLabel || 'Block')}</div>` +
        '<button type="button" role="menuitem" data-del><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 8.5h6l.5-8.5M7 7v4M9 7v4"/></svg>Delete<kbd>⌫</kbd></button>';
      blockMenu.hidden = false;
      blockMenu.style.left = Math.max(8, Math.min(x, innerWidth - blockMenu.offsetWidth - 8)) + 'px';
      blockMenu.style.top = Math.max(8, Math.min(y, innerHeight - blockMenu.offsetHeight - 8)) + 'px';
      blockMenu.querySelector('button').focus();
    }
    blockMenu.addEventListener('click', (e) => { if (e.target.closest('[data-del]')) deleteBlock(selected); });
    // The move grip, resize handle, undo bar and this menu are not blocks; a click on them does what it always did.
    const chrome = (t) => !!(t.closest && t.closest('.mv, .rz, .hx-box, .blk-menu, #editBtn'));
    document.addEventListener('click', (e) => {
      if (!inEdit() || barBusy() || chrome(e.target)) return;
      closeBlockMenu();
      const b = blockOf(e.target);
      if (!b) { select(null); return; }
      select(b);
      if (e.target.closest('[data-tab], [data-range]')) return;   // the section nav and range keep working
      e.preventDefault(); e.stopPropagation();
    }, true);
    document.addEventListener('contextmenu', (e) => {
      if (!inEdit() || barBusy() || chrome(e.target)) return;
      const b = blockOf(e.target);
      if (!b) { closeBlockMenu(); return; }
      e.preventDefault();
      select(b);
      openBlockMenu(b, e.clientX, e.clientY);
    }, true);
    document.addEventListener('pointerover', (e) => { if (inEdit() && !barBusy() && !drag && !chrome(e.target)) hover(blockOf(e.target)); });
    root.addEventListener('pointerleave', () => hover(null));
    document.addEventListener('keydown', (e) => {
      if (!inEdit() || barBusy()) return;
      const t = e.composedPath()[0];
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.key === 'Escape' && (selected || !blockMenu.hidden)) { closeBlockMenu(); select(null); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && selected && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); deleteBlock(selected); }
    });
    addEventListener('scroll', closeBlockMenu, true);
    addEventListener('resize', closeBlockMenu);
    function setDashMode (mode) {
      root.dataset.dashMode = mode;
      const on = mode === 'edit';
      editBtn.setAttribute('aria-pressed', String(on));
      editBtn.querySelector('span').textContent = on ? 'Save' : 'Edit';
      if (!on) { select(null); hover(null); closeBlockMenu(); layoutHistory.save(); }
      if (window.EditModeBar && window.EditModeBar.setActive) window.EditModeBar.setActive(on);
      park();
    }

    // ---- Save: a prompt that makes the saved layout the page's default ----
    // Save keeps the layout in this browser (it comes back on reload); the prompt asks a coding agent to write the same layout into the page itself.
    const layoutFacts = () => {
      const cardSel = (c) => (c.id ? '#' + c.id : `[data-anfra-label="${c.dataset.anfraLabel}"]`);
      const moves = [];
      document.querySelectorAll(MOVABLE).forEach((el) => {
        const p = offsets.get(keyOf(el));
        if (!p || !(p.x || p.y)) return;
        const c = el.classList.contains('card') ? el : el.closest('.card');
        const selector = el.classList.contains('card') ? cardSel(el) : el.classList.contains('wave') ? '.hero .wave' : el.classList.contains('ttl') ? '.hero > .ttl'
          : `.tile "${(el.querySelector('.lbl') || el).textContent.trim()}" in ${c ? cardSel(c) : 'the page'}`;
        moves.push({ label: el.dataset.moveLabel || el.dataset.anfraLabel || (el.querySelector('.lbl') || el).textContent.trim(), selector, x: p.x, y: p.y });
      });
      const sizes = [...document.querySelectorAll('.card.sized')].map((c) => ({ label: c.dataset.anfraLabel || cardKey(c), selector: cardSel(c), width: c.style.width, height: c.style.height }));
      const deleted = [...document.querySelectorAll('.blk-del')].map((el) => ({ label: el.dataset.anfraLabel || el.dataset.anfraBlock, block: el.dataset.anfraBlock }));
      const waveSize = wave.style.width || wave.style.height ? { width: wave.style.width, height: wave.style.height } : null;
      return {
        file: APP_FILE, storageKey: 'lay-saved:one-page:' + APP_FILE, width: innerWidth,
        moves, sizes, wave: waveSize, deleted, tweaks: window.EditModeBar && window.EditModeBar.tweaks ? window.EditModeBar.tweaks() : [],
      };
    };
    const promptDlg = document.createElement('div');
    promptDlg.className = 'lp-dlg'; promptDlg.hidden = true;
    promptDlg.innerHTML = '<div class="lp-box" role="dialog" aria-modal="true" aria-labelledby="lpTitle"><h2 id="lpTitle">Layout saved</h2>' +
      '<p>It stays in this browser and is kept on reload. To make it the default for everyone, give this prompt to a coding agent.</p>' +
      '<textarea readonly aria-label="Prompt for a coding agent"></textarea>' +
      '<div class="row"><button type="button" data-lp="close">Close</button><button type="button" class="primary" data-lp="copy">Copy prompt</button></div></div>';
    document.body.appendChild(promptDlg);
    const lpText = promptDlg.querySelector('textarea');
    const lpClose = () => { promptDlg.hidden = true; };
    promptDlg.addEventListener('click', (e) => {
      const act = e.target.closest('[data-lp]');
      if (e.target === promptDlg || (act && act.dataset.lp === 'close')) lpClose();
      else if (act) {
        lpText.select();
        (navigator.clipboard ? navigator.clipboard.writeText(lpText.value) : Promise.reject()).catch(() => document.execCommand('copy')).then(() => { act.textContent = 'Copied'; setTimeout(() => { act.textContent = 'Copy prompt'; }, 1500); });
      }
    });
    promptDlg.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); lpClose(); } }, true);
    function showLayoutPrompt () {
      const text = window.LayoutPrompt ? window.LayoutPrompt.build(layoutFacts()) : '';
      if (!text) return;   // nothing differs from the default
      lpText.value = text;
      promptDlg.hidden = false;
      promptDlg.querySelector('[data-lp="copy"]').focus();
    }
    editBtn.addEventListener('click', () => {
      const saving = inEdit();
      setDashMode(saving ? 'view' : 'edit');
      if (saving) showLayoutPrompt();
    });
    // In a host page that has its own Edit / Save button (anfra-host-example), that button drives this: say the page can be edited, and drop ours
    // once the host answers. Without a host nobody answers and the button above stays.
    addEventListener('message', (e) => {
      if (e.source !== parent || !e.data || e.data.type !== 'anfra-host:edit') return;
      editBtn.style.display = 'none';
      if (typeof e.data.on === 'boolean' && e.data.on !== inEdit()) setDashMode(e.data.on ? 'edit' : 'view');
    });
    const tellHost = () => { if (parent !== window) parent.postMessage({ type: 'anfra-host:edit-state', on: inEdit() }, '*'); };
    new MutationObserver(tellHost).observe(root, { attributes: true, attributeFilter: ['data-dash-mode'] });
    if (parent !== window) parent.postMessage({ type: 'anfra-host:editable' }, '*');

    // ---- Wiring ----

    $('rangeSeg').innerHTML = L.RANGES.map((d) => `<button type="button" data-range="${d}" aria-pressed="${d === S.range}" aria-label="Last ${d} days">${d}D</button>`).join('');

    // ---- Section nav ----
    // A click scrolls to the section (it stops --stick below the top, clear of the sticky header). While the page scrolls, the section
    // that has crossed a third of the window is marked; at the bottom of the page the last one is, however short it is.
    const SECTIONS = ['overview', 'metrics', 'people'];
    let navLock = 0;   // a click marks its section at once; the smooth scroll that follows must not mark the ones it passes
    function goTo (tab) {
      S.tab = tab;
      markNav();
      navLock = Date.now() + 1500;
      $('sec-' + tab).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
    function spy () {
      if (Date.now() < navLock || $('main').hidden) return;
      let cur = SECTIONS[0];
      for (const t of SECTIONS) if ($('sec-' + t).getBoundingClientRect().top <= innerHeight / 3) cur = t;
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = SECTIONS[SECTIONS.length - 1];
      if (cur !== S.tab) { S.tab = cur; markNav(); }
    }
    let spyQueued = false;
    addEventListener('scroll', () => { if (spyQueued) return; spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spy(); }); }, { passive: true });
    addEventListener('scrollend', () => { navLock = 0; });
    addEventListener('wheel', () => { navLock = 0; }, { passive: true });   // the user took over the scroll

    // The "…" menu of a dashboard row: one element, moved under the button that opened it.
    const menu = document.createElement('div');
    menu.className = 'menu'; menu.hidden = true;
    menu.setAttribute('role', 'menu');
    document.body.appendChild(menu);
    let menuBtn = null;
    function closeMenu () {
      menu.hidden = true;
      if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn = null;
    }
    function openMenu (btn) {
      const name = btn.dataset.menu;
      menu.innerHTML = `<button type="button" role="menuitem" data-open="dash|${esc(name)}">View details</button>` +
        `<a role="menuitem" href="${esc(dashUrl(name))}" target="_blank" rel="noopener noreferrer">Open dashboard</a>` +
        `<button type="button" role="menuitem" data-copy="${esc(dashUrl(name))}">Copy link</button>`;
      menu.hidden = false;
      const r = btn.getBoundingClientRect();
      menu.style.top = Math.min(r.bottom + 4, window.innerHeight - menu.offsetHeight - 8) + 'px';
      menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
      btn.setAttribute('aria-expanded', 'true');
      menuBtn = btn;
    }
    window.addEventListener('scroll', closeMenu, true);
    window.addEventListener('resize', closeMenu);

    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-retry]')) { app.refresh().then(boot); return; }
      if (!Q) return;
      const menuOpener = t.closest('[data-menu]');
      if (menuOpener) { const same = menuOpener === menuBtn; closeMenu(); if (!same) openMenu(menuOpener); return; }
      const copy = t.closest('[data-copy]');
      if (copy) { navigator.clipboard.writeText(copy.dataset.copy).catch(() => {}); closeMenu(); return; }
      // A link opens its page; it must not also open the row's details.
      if (t.closest('a[target]')) { closeMenu(); return; }
      closeMenu();
      const range = t.closest('[data-range]');
      if (range) {
        if (Number(range.dataset.range) === S.range) return;
        setRange(Number(range.dataset.range));
        drawn.trend = {};
        drawn.daily = null;
        renderNow();
        app.execute();
        return;
      }
      const tab = t.closest('[data-tab]');
      if (tab) { goTo(tab.dataset.tab); return; }
      const sort = t.closest('[data-sort]');
      if (sort) {
        const [id, col] = sort.dataset.sort.split(':');
        const s = S.sort[id];
        if (s.key === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
        else { s.key = col; s.dir = ['label', 'name', 'email'].includes(col) ? 'asc' : 'desc'; }
        renderNow();
        const again = document.querySelector(`[data-sort="${id}:${col}"]`);
        if (again) again.focus();
        return;
      }
      if (t.closest('[data-goto="cleanup"]')) {
        S.q = '';
        $('dashQ').value = '';
        S.sort.dash = { key: 'lastView', dir: 'asc' };
        renderDashboards();
        S.tab = 'overview'; markNav();
        $('dashCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const open = t.closest('[data-open]');
      if (open) { openDrawer(open.dataset.open); return; }
      if (t.closest('#drawerClose') || t === $('scrim')) closeDrawer();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuBtn) { closeMenu(); return; }
      if (e.key === 'Escape' && S.drawer) { closeDrawer(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-open]')) {
        e.preventDefault();
        openDrawer(e.target.dataset.open);
      }
    });

    $('dashQ').addEventListener('input', (e) => {
      S.q = e.target.value;
      if (Q) renderDashboards();
    });

    window.addEventListener('resize', () => {
      Object.values(trendCharts).forEach((c) => c.resize());
      if (drawerChart && S.drawer) drawerChart.resize();
    });

    app.subscribe(() => { boot(); schedule(); });
    renderNow();
    app.execute();
  })();
  </script>
