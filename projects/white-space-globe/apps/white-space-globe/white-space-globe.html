    .lensc button { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 2px 6px; border-radius: 6px; }
    .lensc button:hover { background: var(--muted); color: var(--ink); }
    /* One review on the globe: the hovered or pinned theme, from the city it was written in */
    .callout { position: absolute; z-index: 3; width: 260px; background: var(--sheet); border: 1px solid var(--line); border-left: 3px solid var(--w5);
               border-radius: 10px; box-shadow: 0 8px 24px rgb(15 23 42 / .14); padding: 10px 12px; font-size: 12.5px; pointer-events: none; }
    .callout[data-side="good"] { border-left-color: var(--g5); }
    .callout[hidden] { display: none; }
    .callout b { display: block; font-weight: 600; margin-top: 2px; }
    .callout p { margin: 2px 0 0; }
    .callout .who { margin-top: 6px; font-size: 11px; color: var(--ink-2); }
    .stars { color: var(--star); font-size: 11px; letter-spacing: 1px; }
    .hero .star, .kpi .star { color: var(--star); }
    #status { left: calc(var(--pad-l, 380px) + (100% - var(--pad-l, 380px) - var(--pad-r, 420px)) / 2); top: var(--pad-t, 130px); transform: translateX(-50%); padding: 4px 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap; z-index: 4; }
    #status[data-kind="busy"] { display: inline-flex; align-items: center; gap: 7px; }
    #status[data-kind="busy"]::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--hi); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status[data-kind="error"] { color: var(--bad); white-space: normal; max-width: 70%; }
    #status[hidden] { display: none; }
    /* Reloading after a filter change: the old numbers stay, dimmed, under a progress line */
    .app.busy .side > *, .app.busy .kpi .kv, .app.busy #hero-head, .app.busy #legend { opacity: .45; transition: opacity .2s .15s; }
    .app.busy .stage::after { content: ''; position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 2px; pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--hi), transparent) no-repeat; background-size: 35% 100%; animation: busy 1.2s ease-in-out infinite; }
    @keyframes busy { from { background-position: -50% 0; } to { background-position: 150% 0; } }
    .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--sheet); border-radius: 7px; padding: 6px 9px; font-size: 12px; line-height: 1.35; max-width: 260px; }
    .tip b { display: block; font-weight: 600; }
    .tip span { display: block; font-family: var(--f-num); font-size: 11.5px; opacity: .9; }
    .tip span.dim { opacity: .65; }

    /* The list column: tabs that follow the metric, then one pane */
    .side { background: color-mix(in srgb, var(--sheet) 94%, transparent); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--float);
            padding: 20px 14px 12px 20px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; min-width: 0; min-height: 0; }
    .side.one { grid-template-rows: minmax(0, 1fr); } /* one tab: no tab bar */
    .pane { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .tabs { display: grid; grid-template-columns: repeat(var(--n, 3), auto); gap: 2px; padding: 3px; background: var(--muted); border-radius: 9px; }
    .tabs button { border: 0; background: transparent; padding: 5px 8px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
    .tabs button:hover { color: var(--ink); }
    .tabs button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgb(15 23 42 / .08); }
    .side h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; }
    /* the parts of a heading that change (place, metric, theme): same weight, full ink against the muted fixed words */
    .vr { font-weight: inherit; color: var(--ink); }
    .side .note { color: var(--ink-2); font-size: 12.5px; margin-top: -6px; }
    /* The focused place's arithmetic for penetration and white space, with the source of its market size */
    .fact { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; display: grid; gap: 4px; }
    .fact .eq { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12px; }
    .fact .eq b { font-weight: 600; }
    .fact .src { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--ink-2); font-size: 11.5px; }
    .fact .src .badge { cursor: pointer; }
    .rank { display: grid; gap: 1px; align-content: start; overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
    .rank button { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) 56px 66px; gap: 8px; align-items: center; text-align: left; border: 0;
                   background: transparent; padding: 6px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .rank button:hover, .rank button.hl { background: var(--muted); }
    .rank button.cur { background: var(--hi-soft); }
    .rank .no { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .rank .fi { width: 20px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .08); background-size: cover; }
    .rank .tag { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
    .rank .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank .br { height: 4px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .rank .br i { display: block; height: 100%; border-radius: 999px; }
    .rank .v { text-align: right; font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty { color: var(--ink-2); font-size: 13px; background: var(--bg); border-radius: 9px; padding: 12px; }
    .skel { height: 14px; border-radius: 4px; background: var(--muted); }
    /* Good / Bad rating: themes ranked by "x global", then two reviews in the customers' words */
    .say { display: grid; gap: 2px; align-content: start; overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
    .th { display: grid; grid-template-columns: minmax(0, 1fr) 72px 84px; gap: 10px; align-items: center; border: 0; background: transparent; padding: 7px 8px;
          border-radius: 8px; cursor: pointer; text-align: left; font-size: 13px; }
    .th:hover, .th.on { background: var(--muted); }
    .th.pin { background: var(--hi-soft); box-shadow: inset 0 0 0 1px var(--hi-line); }
    .th.thin { color: var(--ink-3); }
    .th .br { height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .th .br i { display: block; height: 100%; border-radius: 999px; background: var(--w4); }
    .xg { justify-self: end; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: var(--muted); color: var(--ink-2); white-space: nowrap; }
    .xg.warm { background: var(--w1); color: var(--w5); }
    .xg.hot { background: var(--w2); color: var(--w6); }
    .good .th .br i { background: var(--g4); }
    .good .xg.warm { background: var(--g1); color: var(--g5); }
    .good .xg.hot { background: var(--g2); color: var(--g6); }
    .qh { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 12px 0 6px; }
    .quote { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 8px; }
    .quote b { display: block; font-weight: 600; margin-top: 2px; }
    .quote .qt { float: right; font-size: 11px; color: var(--ink-2); }
    .quote p { margin: 2px 0 0; color: var(--ink-2); }
    .qh:has(.see-all) { display: flex; justify-content: space-between; align-items: baseline; }
    .see-all { border: 0; background: none; padding: 0; color: var(--hi); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
    /* The drill: every review behind a theme in a place (Basecoat dialog), newest first */
    .drill > div { max-width: min(1280px, calc(100% - 48px)); height: calc(100% - 48px); background: var(--sheet); border: 1px solid var(--line);
                   border-radius: var(--card-r); box-shadow: 0 16px 48px rgb(15 23 42 / .18); padding: 20px 0 16px; gap: 12px; }
    .drill::backdrop { background: rgb(15 23 42 / .35); }
    .drill header { padding: 0 24px; gap: 4px; }
    .drill h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink-2); }
    .drill header p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
    .drill section { overflow: auto; padding: 0 24px; min-height: 0; outline: none; }
    .drill .table { font-size: 12.5px; }
    .drill .table th { position: sticky; top: 0; background: var(--sheet); color: var(--ink-2); font-size: 11.5px; text-align: left; padding: 8px 10px 8px 0; z-index: 1; }
    .drill .table td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
    .drill .table td.rv { white-space: normal; min-width: 340px; color: var(--ink); }
    .drill .table .sub { display: block; color: var(--ink-2); font-size: 11.5px; }
    .drill .table th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .drill .table th button[aria-sort] { color: var(--ink); }
    .drill #drill-show { margin-top: 8px; align-self: flex-start; }
    .drill #drill-show:empty { display: none; }
    .drill .said { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .drill .said.good { background: var(--g1); color: var(--g6); }
    .drill .said.bad { background: var(--w1); color: var(--w6); }
    .drill td.tags { white-space: normal; min-width: 120px; max-width: 220px; }
    .drill td.tags .said { margin: 0 4px 4px 0; }
    .drill .also { display: block; margin-top: 4px; color: var(--ink-2); font-size: 11.5px; }
    .drill footer { padding: 0 24px; justify-content: space-between !important; align-items: center; }
    .drill footer .more { border: 0; background: none; padding: 0; color: var(--hi); font-size: 12.5px; font-weight: 500; cursor: pointer; }
    .drill .x { top: 14px; right: 14px; border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 4px; }
    .drill .empty { padding: 24px 0; color: var(--ink-2); font-size: 13px; }

    /* "How it's calculated": the shared fx panel (apps/shared/fx-panel.js) in this app's tokens; its button sits in the
       corner of a KPI tile, a verdict tile, the chart and the capacity list */
    :root { --fx-surface: var(--sheet); --fx-ink: var(--ink); --fx-muted: var(--ink-2); --fx-faint: var(--ink-3); --fx-line: var(--line);
            --fx-accent: var(--hi); --fx-accent-soft: var(--hi-soft); --fx-accent-line: var(--hi-line); --fx-code-bg: var(--bg); --fx-chip-bg: var(--muted);
            --fx-font: var(--f-ui); --fx-mono: var(--f-num); --fx-width: 560px;
            --fx-lg-metric: var(--g4); --fx-lg-field: var(--q3); --fx-lg-dataset: var(--w4); --fx-lg-model: var(--q5); }
    html.dark { --fx-syn-kw: #c4b5fd; --fx-syn-str: #6ee7b7; --fx-syn-num: #fcd34d; --fx-syn-fn: #93c5fd; }
    .vchart > .fx-btn.fx-corner, .cap > .fx-btn.fx-corner { top: 13px; right: 14px; }
    [data-fx-src] { cursor: pointer; }
    /* Pages: Overview (the globe) and Size vs strength (verdicts, a big scatter and where to add capacity). Same filters;
       Compare belongs to the globe */
    .top .acts { display: flex; align-items: center; gap: 12px; }
    /* Underline tabs, from Claude Design's Coverage Dashboard: the active page in full ink over a glowing accent bar */
    .pages { display: flex; gap: 4px; }
    .pages button { position: relative; height: 36px; padding: 0 12px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 14px; font-weight: 500; }
    .pages button:hover { color: var(--ink); }
    .pages button[aria-selected="true"] { color: var(--ink); }
    .pages button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px; background: transparent; transition: background .15s, box-shadow .15s; }
    .pages button[aria-selected="true"]::after { background: var(--hi); box-shadow: 0 0 10px var(--hi); }
    .app[data-page="svs"] :is(.kpis, .main, #cmp-dd), .app[data-page="overview"] :is(.verdicts, .main2) { display: none; }

    /* Verdict tiles: white space and market count per verdict; a tile filters the list and the chart */
    .verdicts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .vt { position: relative; text-align: left; border: 1px solid transparent; background: var(--sheet); border-radius: var(--card-r); padding: 14px 16px; min-width: 0; cursor: pointer;
          display: grid; gap: 2px; box-shadow: var(--float); transition: border-color .15s, background .15s; }
    .vt:hover { border-color: var(--hi-line); }
    .vt[aria-pressed="true"] { border-color: var(--hi-line); background: var(--hi-soft); box-shadow: 0 0 0 1px var(--hi-line) inset; }
    .vt .hd { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
    .vt .hd small { margin: 0 26px 0 auto; font-weight: 400; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .vt b { font-weight: 600; font-size: 18px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .vt b small { font-size: 12px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
    .vt em { font-style: normal; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .sw.enter { background: repeating-linear-gradient(45deg, var(--ink-3) 0 1.5px, var(--land) 1.5px 4px); box-shadow: inset 0 0 0 1px var(--line); }

    .main2 { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 450px; background: var(--sheet); min-height: 0;
             border-radius: 20px; overflow: hidden; box-shadow: var(--float); }
    .main2.busy > * { opacity: .45; transition: opacity .2s .15s; }
    .vchart { position: relative; border-right: 1px solid var(--line); padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 480px; min-width: 0; }
    .vchart h2, .cap h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink-2); }
    .vchart .note, .cap .note { color: var(--ink-2); font-size: 12.5px; }
    .vchart .plot { flex: 1; min-height: 0; position: relative; }
    .vchart svg { position: absolute; inset: 0; overflow: visible; }
    .vchart .ax text { font-size: 10.5px; fill: var(--ink-2); font-family: var(--f-num); }
    .vchart .ax line, .vchart .ax path { stroke: var(--line); }
    .vchart .axl { font-size: 11px; fill: var(--ink-2); }
    .vchart .split { stroke: var(--ink-3); stroke-width: 1; }
    .vchart .bm { stroke: var(--hi); stroke-dasharray: 4 3; }
    .vchart .bmt { font-size: 10.5px; fill: var(--hi); }
    .vchart .zone { fill: var(--hi-soft); }
    .vchart .lane { fill: var(--bg); }
    .vchart .qn { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-2); paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
    .vchart .dot { stroke: var(--sheet); stroke-width: 1.2; cursor: pointer; transition: opacity .15s; }
    .vchart .dot.hl, .vchart .dot:hover, .vchart .dot.cur { stroke: var(--ink); stroke-width: 2; }
    .vchart .dot.enter { stroke: var(--ink-3); }
    .vchart .dot.off { fill: var(--line) !important; stroke: var(--sheet); } /* filtered out by a verdict tile: gray context, not faded color */
    .vchart .lbl { font-size: 11.5px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
    .vchart .lbl.off { opacity: .2; }
    .vchart .lead { stroke: var(--ink-3); stroke-width: 1; pointer-events: none; }
    .vchart .lead.off { opacity: .2; }
    .vchart .tip { position: absolute; }

    /* Where to add capacity: every market with white space, its blocker and the play that follows from it */
    .cap { position: relative; padding: 14px 14px 12px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
    .cap .note { margin-top: -6px; }
    .cap .list { display: grid; gap: 1px; align-content: start; overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
    .cap .row { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; text-align: left; border: 0;
                background: transparent; padding: 7px 6px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .cap .row:hover, .cap .row.hl { background: var(--muted); }
    .cap .row.cur { background: var(--hi-soft); }
    .cap .no { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .cap .fi { width: 20px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .08); background-size: cover; }
    .cap .nm { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 500; }
    .cap .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cap .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cap .play { grid-column: 3; color: var(--ink-2); font-size: 12px; line-height: 1.35; }
    .cap .bk { grid-column: 4; justify-self: end; align-self: start; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--muted); color: var(--ink-2); white-space: nowrap; }
    .cap .bk.theme { background: var(--w1); color: var(--w6); }
    .cap .bk.shrink { background: color-mix(in srgb, var(--bad) 12%, var(--sheet)); color: var(--bad); }

    /* Narrow: on the app's own width, not the window's, so the docked inspect panel (which pads the body) gets it too */
    body { container-type: inline-size; }
    @container (max-width: 1100px) {
      .app { height: auto; }
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .verdicts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main, .main2 { grid-template-columns: minmax(0, 1fr); }
      .main { grid-template-rows: auto 560px auto; }
      .stage { position: relative; inset: auto; grid-row: 2; border-radius: 20px; -webkit-mask-image: none; mask-image: none; }
      .main > .side { grid-row: 3; }
      .main > .gap { display: none; }
      .kpis { max-width: none; margin-top: 18px; }
      .vchart { height: 520px; border-right: 0; border-bottom: 1px solid var(--line); }
      .side, .cap { height: 560px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app" data-page="overview" data-anfra-container="page" data-anfra-label="Coverage Globe">
    <header class="top" data-anfra-container="header" data-anfra-label="Header">
      <div class="title" data-anfra-block="brand" data-anfra-label="Title">
        <h1>White Space Globe</h1>
        <p>The world on a single screen. Track regional performance, spot market gaps, and scale your global footprint.</p>
      </div>
      <div class="acts">
        <div class="pages" id="pages" role="tablist" aria-label="Page" data-anfra-block="pages" data-anfra-label="Pages">
          <button type="button" role="tab" data-page="overview" aria-selected="true">Overview</button>
          <button type="button" role="tab" data-page="svs" aria-selected="false">Size vs strength</button>
        </div>
      </div>
    </header>

    <div class="controls" data-anfra-container="controls" data-anfra-label="Controls">
      <div class="dropdown-menu" id="country-dd" data-anfra-block="country" data-anfra-label="Country">
        <button type="button" class="btn trig" data-variant="outline" data-size="sm" aria-haspopup="menu" aria-expanded="false"><span class="lbl">Country</span><b class="val">All</b><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div data-popover aria-hidden="true" data-align="start" class="country-pop"><div role="menu"></div></div>
      </div>
      <div class="popover" id="ind-pop" data-anfra-block="industry" data-anfra-label="Industry" data-anfra-control="industry">
        <button type="button" class="btn trig" data-variant="outline" data-size="sm" aria-haspopup="dialog" aria-expanded="false"><span class="lbl">Industry</span><b class="val"></b><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div data-popover aria-hidden="true" data-align="start" class="ind-pop">
          <input class="input" type="search" placeholder="Search…" aria-label="Search industries">
          <div class="ind-list"></div>
          <footer><button type="button" class="btn" data-variant="ghost" data-size="sm" data-act="clear">Clear</button><button type="button" class="btn" data-variant="ghost" data-size="sm" data-act="done">Done</button></footer>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="button-group" id="range" role="group" aria-label="Date range" data-anfra-block="date" data-anfra-label="Date" data-anfra-control="date">
        <button type="button" class="btn" data-size="sm" data-range="ytd">YTD</button>
        <button type="button" class="btn" data-size="sm" data-range="l12m">12M</button>
        <button type="button" class="btn" data-size="sm" data-range="all">All time</button>
        <div class="popover" id="custom-pop">
          <button type="button" class="btn" data-size="sm" data-range="custom" aria-haspopup="dialog" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5 H14 M5.5 1.5 V4.5 M10.5 1.5 V4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span id="custom-label">Custom</span></button>
          <div data-popover aria-hidden="true" data-align="end" class="custom-pop">
            <label class="label">From <input class="input" id="from" type="month"></label>
            <label class="label">To <input class="input" id="to" type="month"></label>
          </div>
        </div>
      </div>
      <div class="dropdown-menu" id="cmp-dd" data-anfra-block="compare" data-anfra-label="Compare to">
        <button type="button" class="btn trig" data-variant="outline" data-size="sm" aria-haspopup="menu" aria-expanded="false"><span class="lbl">Compare to</span><b class="val"></b><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div data-popover aria-hidden="true" data-align="end"><div role="menu"></div></div>
      </div>
    </div>

    <div class="main" data-anfra-container="main" data-anfra-label="Globe and list">
      <div class="stage" id="stage" data-anfra-block="globe" data-anfra-label="Globe" data-anfra-query="countries states cities markets themes_by_country quotes">
        <div id="globe"></div>
        <div id="rim"></div>
        <div id="oceans" aria-hidden="true"></div>
        <div id="labels"></div>
        <div id="pins"></div>
        <svg id="leader" aria-hidden="true"></svg>
        <div class="ov card-ov" id="status">Loading…</div>
        <div class="ov lensc card-ov" id="lens" hidden></div>
        <div class="callout" id="callout" hidden></div>
        <div class="ov zoom" data-anfra-render="skip">
          <button class="btn" data-variant="outline" data-size="icon" id="zin" type="button" aria-label="Zoom in">+</button>
          <button class="btn" data-variant="outline" data-size="icon" id="zout" type="button" aria-label="Zoom out">−</button>
          <button class="btn" data-variant="outline" data-size="icon" id="zre" type="button" aria-label="Center on the selected place" title="Center on the selected place">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="4.5"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
          </button>
        </div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="left" id="left">
        <section class="hero" id="hero" data-anfra-block="kpis" data-anfra-label="Selected metric and metric switcher" data-anfra-query="world countries states cities">
          <nav class="crumbs" id="crumbs" aria-label="Zoom level"></nav>
          <div id="hero-head"><div class="skel" style="width:40%"></div></div>
          <div class="kpis" id="kpis">
            <div class="kpi"><span class="ic"></span><span class="kv"><small>&nbsp;</small><span class="skel"></span></span></div>
          </div>
          <div class="legend" id="legend" hidden></div>
        </section>
      </div>
      <div class="gap"></div>
      <aside class="side one" id="side" aria-live="polite" data-anfra-block="list" data-anfra-label="Ranking and reviews" data-anfra-query="countries states cities markets themes themes_by_country quotes">
        <div class="pane"><div class="skel" style="width:50%"></div><div class="skel"></div><div class="skel"></div></div>
      </aside>
    </div>

    <div class="verdicts" id="verdicts" data-anfra-block="verdicts" data-anfra-label="Verdict tiles (filter)" data-anfra-query="verdicts"></div>
    <div class="main2" id="main2" data-anfra-container="svs" data-anfra-label="Size vs strength">
      <div class="vchart" id="chart" data-anfra-block="svs-chart" data-anfra-label="Penetration against white space" data-anfra-query="verdicts"></div>
      <aside class="cap" id="cap" aria-live="polite" data-anfra-block="capacity" data-anfra-label="Where to add capacity" data-anfra-query="verdicts themes_by_country states"></aside>
    </div>
  </div>
  <dialog class="dialog drill" id="drill" aria-labelledby="drill-title" data-anfra-block="drill" data-anfra-label="Reviews behind a theme">
    <div>
      <header><h2 id="drill-title"></h2><p id="drill-note"></p><div class="button-group" id="drill-show" role="group" aria-label="Praise or complaints"></div></header>
      <section id="drill-body" tabindex="-1"></section>
      <footer><button type="button" class="more" id="drill-query">See the query →</button><button type="button" class="btn" data-variant="outline" data-size="sm" id="drill-close">Close</button></footer>
      <button type="button" class="x" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </dialog>

  <script>
    const $ = s => document.querySelector(s);
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const num = v => (v == null ? null : Number(v));
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const DATASET = 'global_sales';
    const FIRST_YEAR = 2019; // first snapshot year: All time starts here
    // The data cut-off when this was written: the first screen's queries go out with meta instead of after it.
    // meta still decides: another cut-off re-applies the range.
    const AS_OF_HINT = '2026-09-30';

    // ---------------------------------------------------------------- formatting (display only)
    const fInt = v => Math.round(v).toLocaleString('en-US');
    const fMoney = v => { const a = Math.abs(v);
      return a >= 1e9 ? `$${(v / 1e9).toFixed(2)}B` : a >= 1e6 ? `$${(v / 1e6).toFixed(1)}M` : a >= 1e3 ? `$${Math.round(v / 1e3)}K` : `$${Math.round(v)}`; };
    const fPct = v => `${(v * 100).toFixed(v < 0.0001 ? 3 : v < 0.01 ? 2 : 1)}%`;
    const fSigned = v => `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(0)}%`;
    const fPp = v => `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(2)} pp`; // change of a ratio, in percentage points
    const fRating = v => `${v.toFixed(2)} ★`;
    const fStars = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2)} ★`; // change of a rating, in stars
    const fBench = v => `${(v * 100).toFixed(2)}%`; // the benchmark in arithmetic: two decimals, like its format

    // ---------------------------------------------------------------- definitions (generated from the dataset)
    // Label, one-line summary (the description's first sentence) and AQL per metric: coverage-globe.definitions.js,
    // written from `anfra show global_sales` by scripts/coverage-globe/export_definitions.py. Never hand-copied here.
    const DEFS = ARCFIELD_DEFS;

    // ---------------------------------------------------------------- metrics (all values come from the dataset)
    // The six KPI tiles, in order, are the metric switcher. col: the query alias. chg: its change vs the comparison period
    // (also from the dataset). low: the row is too thin to color (hatched instead). geoOnly: needs market size (no city
    // level, all industries only). noCompare: no change view. def: the dataset metric.
    // src: where a metric read straight from a source comes from (the popover's formula is the dataset's AQL).
    const METRICS = {
      customers: { label: 'Customers', def: 'customers', col: 'customers', fmt: fInt, chg: 'customers_chg', chgFmt: fSigned,
        src: 'Arcfield CRM · subscriptions' },
      arr: { label: 'ARR', def: 'arr', lower: 'ARR', col: 'arr', fmt: fMoney, chg: 'arr_chg', chgFmt: fSigned },
      arpc: { label: 'ARR per customer', def: 'arr_per_customer', lower: 'ARR per customer', col: 'arpc', fmt: fMoney, chg: 'arpc_chg', chgFmt: fSigned },
      penetration: { label: 'Penetration', def: 'penetration', col: 'penetration', fmt: fPct, geoOnly: true, chg: 'penetration_chg', chgFmt: fPp },
      white_space: { label: 'White space', def: 'untapped_arr', col: 'white_space', fmt: fMoney, geoOnly: true, noCompare: true, ramp: 'w' },
      rating: { label: 'Rating', def: 'avg_rating', col: 'rating', fmt: fRating, chg: 'rating_chg', chgFmt: fStars,
        low: r => !(num(r.reviews) >= 10), lowText: 'Fewer than 10 reviews', src: 'Arcfield reviews (synthetic)',
        // Compared over the reviews written in the comparison range (not a month-end), 10 or more on both sides
        prev: 'reviews_prev', fewBefore: r => !(num(r.reviews_prev) >= 10 && num(r.reviews) >= 10), fewText: 'Under 10 reviews in either period' },
    };
    const TILES = ['customers', 'arr', 'arpc', 'penetration', 'white_space', 'rating'];
    const lower = m => m.lower ?? m.label.toLowerCase();
    const vr = html => `<b class="vr">${html}</b>`; // a heading's changing part (already escaped)

    // ---------------------------------------------------------------- queries
    // The same level queries (world, countries, then states and cities once opened) per comparison: the comparison is a relative_period in
    // their AQL, so each one gets its own set, declared on first use. The Date and Industry filters are mapped onto
    // them. Point-in-time metrics take the last month-end inside the date range (defined in the dataset); review
    // metrics count the reviews written inside it.
    const app = Anfra.createApp({ title: 'White Space Globe', timezone: 'Etc/UTC' });
    Inspector.mount(app); // the docked inspect panel (apps/white-space-globe/inspector.js), on Alt+Shift+I; links to a query open the fx panel instead
    const Q = {
      // The data cut-off ("today"): the date presets count back from it
      meta: app.createQuery('meta', { dataset: DATASET, aql: `explore { measures { as_of: max(account_snapshots.snapshot_at) } }` }),
      // Every market (a country, or a US state), entered or not, with its market size and source, and what a new
      // customer is worth there (white space). Not filtered by industry or date.
      markets: app.createQuery('markets', { dataset: DATASET, aql: `explore {
        dimensions { code: geo_countries.country_code, name: geo_countries.name, iso: geo_countries.iso_n3,
                     region: geo_countries.region, lat: geo_countries.lat, lon: geo_countries.lon,
                     market: market_size.market_id, source: market_size.source, source_year: market_size.source_year,
                     source_note: market_size.source_note, expected_arpc: geo_countries.expected_arr_per_customer,
                     arpc_today: geo_countries.arr_per_customer_latest }
        measures { addressable: addressable_companies }
      }` }),
    };
    const industry = app.createFilter('industry', { dataset: DATASET, field: 'accounts.industry', label: 'Industry' });
    const dateFilter = app.createFilter('date', { type: 'date', label: 'Date' });
    // One execute at a time: queries declared while one runs get their own run right after
    let running = null, again = false;
    function run() {
      if (running) { again = true; return; }
      running = app.execute().finally(() => { running = null; if (again) { again = false; run(); } });
    }

    const LEVEL_DIMS = {
      world: '',
      countries: 'code: geo_countries.country_code',
      states: 'code: geo_states.state_code, name: geo_states.name',
      cities: 'id: geo_cities.city_id, name: geo_cities.name, lat: geo_cities.lat, lon: geo_cities.lon, market: geo_cities.market_id',
    };
    function levelAql(level, interval) {
      const geo = level !== 'cities', rp = interval && `relative_period(account_snapshots.snapshot_at, interval(${interval}))`;
      const m = ['customers: customers', 'arr: arr', 'arpc: arr_per_customer', 'rating: avg_rating', 'reviews: review_count'];
      if (geo) m.push('addressable: addressable_companies', 'penetration: penetration');
      if (geo) m.push('white_space: untapped_arr', 'untapped: untapped_accounts');
      if (level === 'world') m.push('benchmark: benchmark_penetration'); // the top penetration class
      if (rp) {
        m.push(`customers_prev: customers | ${rp}`, `customers_chg: safe_divide(customers, customers | ${rp}) - 1`,
          `arr_chg: safe_divide(arr, arr | ${rp}) - 1`, `arpc_chg: safe_divide(arr_per_customer, arr_per_customer | ${rp}) - 1`);
        if (geo) m.push(`penetration_chg: penetration - (penetration | ${rp})`);
        // Reviews count inside the range, so the rating shifts on their own date (shifting the snapshot date leaves them be).
        // First in the list: anfra 0.8.0 fails to compile a shifted review_count listed after the plain one
        const rr = `relative_period(reviews.created_at, interval(${interval}))`;
        m.unshift(`reviews_prev: review_count | ${rr}`, `rating_chg: avg_rating - (avg_rating | ${rr})`);
      }
      const dims = LEVEL_DIMS[level];
      return `explore {\n${dims ? `dimensions { ${dims} }\n` : ''}measures { ${m.join(',\n  ')} }\n}`;
    }
    // A set: the level queries for one comparison (shift in months, 0 = none).
    // Only the wanted levels: world and countries draw the first screen; states and cities join the first time the
    // reader opens the US or a market (wantLevel), and every set declared after that has them too.
    const sets = new Map(), wanted = new Set(['world', 'countries']), declaring = new Set();
    function querySet(shift) {
      const id = `v${shift}`;
      if (!sets.has(id)) sets.set(id, {}); // first: declaring a query notifies subscribers (onData) synchronously, which may ask again
      const qs = sets.get(id);
      let added = false;
      for (const level of Object.keys(LEVEL_DIMS)) {
        if (!wanted.has(level) || declaring.has(`${id}:${level}`)) continue;
        declaring.add(`${id}:${level}`); // before createQuery, for the same reason
        const name = `${level}${shift ? `_vs_${shift}m_ago` : ''}`;
        const q = qs[level] = Q[name] = app.createQuery(name, { dataset: DATASET, aql: levelAql(level, shift && `-${shift} months`) });
        Object.assign(q, { level, setId: id, qname: name });
        app.mapControl(industry, q, { field: 'accounts.industry' });
        app.mapControl(dateFilter, q, { field: 'account_snapshots.snapshot_at' }); app.mapControl(dateFilter, q, { field: 'reviews.created_at' });
        added = true;
      }
      if (added) run();
      return qs;
    }
    // A level the reader needs for the first time joins the set in use now: the chosen range's
    function wantLevel(level) {
      if (wanted.has(level)) return;
      wanted.add(level);
      if (st.view) querySet(+st.view.slice(1));
    }

    // Review themes, for the Good / Bad rating tabs and the theme lens: every review since 2019, whatever the date
    // range (a year has too few reviews per theme and country to compare), filtered by industry. Praise and complaint
    // shares and their "x global" ratios are dataset metrics. Quotes: reviews that mention a single theme, so the text
    // is about that theme only (reviews.theme_count). Declared when the Rating metric or Size vs strength first opens.
    const THEME_M = 'mentions: theme_reviews, complaints: complaint_reviews, praise: praise_reviews, cshare: complaint_share, pshare: praise_share,\n  reviews: review_count | of_all(review_themes.theme)';
    let themesDeclared = false;
    function themeQueries() {
      if (themesDeclared) return;
      themesDeclared = true; // first: declaring a query notifies subscribers (onData) synchronously, which asks again
      Q.themes = app.createQuery('themes', { dataset: DATASET, aql: `explore {\ndimensions { theme: review_themes.theme }\nmeasures { ${THEME_M} }\n}` });
      Q.themes_by_country = app.createQuery('themes_by_country', { dataset: DATASET, aql: `explore {\ndimensions { code: geo_countries.country_code, theme: review_themes.theme }
measures { ${THEME_M},\n  cx: complaint_vs_global, px: praise_vs_global }\n}` });
      Q.quotes = app.createQuery('quotes', { dataset: DATASET, aql: `explore {
dimensions { code: geo_countries.country_code, theme: review_themes.theme, sentiment: review_themes.sentiment, id: reviews.review_id,
  title: reviews.title, body: reviews.body, score: reviews.score, city: geo_cities.name, lat: geo_cities.lat, lon: geo_cities.lon }
measures { n: theme_reviews }
filters { reviews.theme_count == 1 }\n}` });
      for (const q of [Q.themes, Q.themes_by_country, Q.quotes]) app.mapControl(industry, q, { field: 'accounts.industry' });
      run();
    }

    // ---------------------------------------------------------------- data, indexed from query results (rows keyed by slice)
    const D = { world: {}, country: {}, state: {}, city: {}, markets: {}, isoToCode: {}, asOf: null };
    // Themes: global rows, per-country rows with the country's review count, and up to two quotes per place, theme and side
    const TH = { ready: false, global: [], reviews: 0, countries: {}, quotes: { good: {}, bad: {} } };
    const themeRow = r => ({ theme: r.theme, mentions: num(r.mentions) || 0, complaints: num(r.complaints) || 0, praise: num(r.praise) || 0,
                             cshare: num(r.cshare) || 0, pshare: num(r.pshare) || 0, cx: num(r.cx), px: num(r.px) });
    const INDEX = {
      world(rows, k) { D.world[k] = rows[0]; if (rows[0]?.benchmark != null) D.benchmark = num(rows[0].benchmark); },
      countries(rows, k) { for (const c of Object.values(D.country)) delete c[k]; for (const r of rows) (D.country[r.code] ??= {})[k] = r; },
      states(rows, k) { // non-US accounts come back under an empty state: skip them
        for (const s of Object.values(D.state)) delete s.rows[k];
        for (const r of rows) if (r.code) ((D.state[r.code] ??= { code: r.code, name: r.name, rows: {} }).rows[k] = r);
      },
      cities(rows, k) {
        for (const c of Object.values(D.city)) delete c.rows[k];
        for (const r of rows) ((D.city[r.id] ??= { id: r.id, name: r.name, lat: num(r.lat), lon: num(r.lon), market: r.market, rows: {} }).rows[k] = r);
      },
      meta(rows) { D.asOf = String(rows[0]?.as_of ?? '').slice(0, 10) || null; },
      markets(rows) {
        D.markets = {}; D.isoToCode = {}; D.market = {};
        for (const r of rows) {
          const m = D.markets[r.code] ??= { code: r.code, name: r.name, iso: r.iso, region: r.region, lat: num(r.lat), lon: num(r.lon), addressable: 0, sources: [],
                                            expectedArpc: num(r.expected_arpc), arpcToday: num(r.arpc_today) };
          D.market[r.market] = { source: r.source, year: r.source_year, note: r.source_note };
          m.addressable += num(r.addressable) || 0;
          const src = `${r.source} ${r.source_year}`;
          if (!m.sources.includes(src)) m.sources.push(src);
          D.isoToCode[r.iso] = r.code;
        }
        renderCountryMenu();
      },
      verdicts(rows) {
        D.svs = {};
        for (const r of rows) if (r.code) D.svs[r.code] = { customers: num(r.customers) || 0, pen: num(r.penetration) || 0, ws: num(r.white_space) || 0, yoy: num(r.customers_yoy) };
      },
      themes(rows) {
        TH.global = rows.filter(r => r.theme).map(themeRow);
        TH.reviews = num(rows.find(r => r.theme)?.reviews) || 0;
      },
      themes_by_country(rows) {
        TH.countries = {};
        for (const r of rows) if (r.theme) (TH.countries[r.code] ??= { reviews: num(r.reviews) || 0, themes: [] }).themes.push(themeRow(r));
      },
      // Two different texts per place, theme and side (the synthetic reviews repeat sentences): the strongest score
      // first (lowest for a complaint, highest for praise), then the oldest review
      quotes(rows) {
        const groups = { good: {}, bad: {} };
        for (const r of rows) {
          const side = r.sentiment === 'positive' ? 'good' : 'bad', q = { id: num(r.id), title: r.title, body: r.body, score: num(r.score), city: r.city, lat: num(r.lat), lon: num(r.lon) };
          for (const p of [r.code, 'world']) ((groups[side][p] ??= {})[r.theme] ??= []).push(q);
        }
        TH.quotes = { good: {}, bad: {} };
        for (const side of ['good', 'bad']) for (const [p, byTheme] of Object.entries(groups[side])) for (const [theme, qs] of Object.entries(byTheme)) {
          qs.sort((a, b) => (side === 'good' ? b.score - a.score : a.score - b.score) || a.id - b.id);
          const out = [], seen = new Set();
          for (const q of qs) { if (seen.has(q.body)) continue; seen.add(q.body); out.push(q); if (out.length === 2) break; }
          (TH.quotes[side][p] ??= {})[theme] = out;
        }
      },
    };

    // ---------------------------------------------------------------- places (world > country > US state > city)
    const WORLD = { key: 'world', level: 'world', name: 'World', parent: null };
    const nodeCache = new Map();
    const cached = (key, make) => nodeCache.get(key) || nodeCache.set(key, make()).get(key);
    const countryNode = code => cached(`c:${code}`, () => ({ key: `c:${code}`, level: 'country', code, get name() { return D.markets[code]?.name ?? code; }, parent: WORLD }));
    const stateNode = code => cached(`s:${code}`, () => ({ key: `s:${code}`, level: 'state', code, get name() { return D.state[code]?.name ?? code; }, parent: countryNode('USA') }));
    const cityNode = id => cached(`t:${id}`, () => {
      const c = D.city[id];
      return { key: `t:${id}`, level: 'city', id, name: c.name, lat: c.lat, lon: c.lon,
               parent: c.market.startsWith('US-') ? stateNode(c.market) : countryNode(c.market) };
    });
    function rowsOf(n) {
      if (n.level === 'world') return D.world;
      if (n.level === 'country') return D.country[n.code] || {};
      if (n.level === 'state') return D.state[n.code]?.rows || {};
      return D.city[n.id]?.rows || {};
    }
    // White space and penetration need market size, which stops at countries and US states: no cities under them
    const citiesShown = () => !METRICS[st.metric].geoOnly;
    const citiesIn = market => (citiesShown() ? Object.values(D.city).filter(c => c.market === market).map(c => cityNode(c.id)) : []);
    function childrenOf(n) {
      if (n.level === 'world') return Object.keys(D.markets).map(countryNode);
      if (n.level === 'country') return n.code === 'USA' ? Object.keys(D.state).map(stateNode) : citiesIn(n.code);
      if (n.level === 'state') return citiesIn(n.code);
      return [];
    }
    const countryOf = n => { while (n && n.level !== 'country') n = n.parent; return n; };
    const inUS = n => countryOf(n)?.code === 'USA';
    // The place whose cities are on the globe: a focused non-US country or US state, or a focused city's parent
    function cityParent(n) {
      if (!citiesShown()) return null;
      if (n.level === 'city') return n.parent;
      if (n.level === 'state' || (n.level === 'country' && n.code !== 'USA')) return n;
      return null;
    }
    // The list beside the globe: the focus's children, or a city's siblings
    const listHost = n => (childrenOf(n).length ? n : n.parent || n);
    const PLURAL = { country: 'Countries', state: 'States', city: 'Cities' };

    // ---------------------------------------------------------------- state
    // view: the key of the rows on screen (v<shift> for the chosen range).
    // tab: the list column's tab. lens / lensSide: the pinned review theme and its side; lensHover: the hovered one.
    // page: overview (the globe) or svs (Size vs strength); verdict: the verdict tile that filters that page.
    const st = { metric: 'customers', focus: WORLD, industry: '', range: 'ytd', from: '', to: '', cmp: 'none', cmpN: 3, view: null,

      }
      map.setPaintProperty('points', 'circle-color', ['coalesce', ['feature-state', 'color'], css('--land')]);
      map.setPaintProperty('points', 'circle-stroke-color', ['case', ['boolean', ['feature-state', 'sel'], false], css('--ink'), css('--sheet')]);
      map.setPaintProperty('cities', 'circle-stroke-color', ['case', ['get', 'sel'], css('--ink'), ['get', 'low'], css('--ink-3'), css('--sheet')]);
      map.updateImage('hatch', hatchImage());
    }

    // ---------------------------------------------------------------- paint: colors, dots, cities, legend
    // The place whose cities are shown is drawn plain, so the bubbles carry the color. A theme lens colors the
    // countries by the theme instead (the US states step aside for it).
    let scales = {};
    function paint() {
      if (!mapReady || !Object.keys(D.markets).length || !st.view) return;
      const y = st.view, metric = st.metric, fc = st.focus, theme = lensTheme(), side = lensSide(), ls = theme && lensScale(side);
      const usView = inUS(fc) && !theme, focusCountry = countryOf(fc);
      const cp0 = cityParent(fc), cityKids = cp0 && !theme ? childrenOf(cp0).filter(k => num(rowsOf(k)[y]?.customers) > 0) : [];
      const cp = cityKids.length ? cp0 : null; // a market with no customers keeps its own color
      const focusState = fc.level === 'state' ? fc : fc.level === 'city' && fc.parent.level === 'state' ? fc.parent : null;

      // countries
      const cScale = makeScale(childrenOf(WORLD), metric);
      scales = { country: cScale };
      const colorOf = (code, row, node) => {
        if (theme) { const v = code && lensVal(code, theme, side); return { color: v == null ? null : ls(v), hatch: false }; }
        if (node && node === cp) return { color: null, hatch: false }; // the canvas for its cities
        const v = code ? shadeOf(metric, row, node) : null;
        return { color: v == null ? null : cScale(v), hatch: isLow(metric, row) || (!!code && notEntered(metric, row, v)) };
      };
      for (const f of geo.countries.features) {
        const code = D.isoToCode[f.properties.iso], node = code && countryNode(code);
        const hidden = usView && code === 'USA'; // the states draw the US
        const c = hidden ? { color: null, hatch: false } : colorOf(code, code && D.country[code]?.[y], node);
        map.setFeatureState({ source: 'countries', id: f.properties.iso }, { ...c, sel: !!focusCountry && code === focusCountry.code && !usView });
        if (code) geo.countryFeature.set(code, f);
      }
      // markets with no (or a tiny) polygon get a dot
      const pointFeatures = [];
      for (const m of Object.values(D.markets)) {
        const f = geo.countryFeature.get(m.code), b = f && mainBounds(f);
        if (!b || (b[1][0] - b[0][0]) * (b[1][1] - b[0][1]) < 1.5)
          pointFeatures.push({ type: 'Feature', properties: { code: m.code, name: m.name }, geometry: { type: 'Point', coordinates: [m.lon, m.lat] } });
      }
      map.getSource('points').setData({ type: 'FeatureCollection', features: pointFeatures });
      pointCodes = new Set(pointFeatures.map(f => f.properties.code));
      for (const p of pointFeatures) {
        const code = p.properties.code;
        map.setFeatureState({ source: 'points', id: code }, { color: colorOf(code, D.country[code]?.[y], countryNode(code)).color, sel: !!focusCountry && code === focusCountry.code });
      }
      map.setLayoutProperty('points', 'visibility', usView ? 'none' : 'visible');

      // US states
      for (const id of ['states-fill', 'states-hatch', 'states-line', 'states-halo', 'states-hl']) map.setLayoutProperty(id, 'visibility', usView ? 'visible' : 'none');
      if (usView) {
        const sScale = makeScale(childrenOf(countryNode('USA')), metric);
        scales.state = sScale;
        for (const f of geo.states.features) {
          const s = Object.values(D.state).find(x => x.name === f.properties.name), node = s && stateNode(s.code);
          const row = s?.rows[y], v = s && node !== cp ? shadeOf(metric, row, node) : null;
          map.setFeatureState({ source: 'states', id: f.properties.name }, {
            color: v == null ? null : sScale(v), hatch: !!s && node !== cp && (isLow(metric, row) || notEntered(metric, row, v)),
            sel: !!focusState && f.properties.name === focusState.name,
          });
        }
      }

      // cities of the focused country or state: bubbles sized by customers, colored by the metric (customers for penetration and white space)
      let cityFeatures = [];
      if (cp) {
        const kids = childrenOf(cp), ck = metricAt('city');  // the scale spans every city, the bubbles those with customers
        const cityScale = makeScale(kids, ck);
        scales.city = cityScale;
        const maxC = d3.max(kids, k => d3.max(domainKeys(), kk => num(rowsOf(k)[kk]?.customers))) || 1;
        cityFeatures = cityKids.map(k => {
          const row = rowsOf(k)[y], v = shadeOf(ck, row, k);
          return { type: 'Feature', geometry: { type: 'Point', coordinates: [k.lon, k.lat] },
            properties: { id: k.id, name: k.name, customers: num(row.customers),
              r: 4 + 15 * Math.sqrt(num(row.customers) / maxC),
              color: v == null ? css('--land') : cityScale(v), low: isLow(ck, row), sel: fc === k } };
        });
      }
      map.getSource('cities').setData({ type: 'FeatureCollection', features: cityFeatures });
      setLabels(cityFeatures);
      renderLegend(cp ? 'city' : usView ? 'state' : 'country');
    }

    // City names: HTML labels for the biggest cities in view (no glyph server without a basemap)
    let labelItems = [];
    function setLabels(features) {
      labelItems = features.slice().sort((a, b) => b.properties.customers - a.properties.customers).slice(0, 12)
        .map(f => ({ lngLat: f.geometry.coordinates, r: f.properties.r, name: f.properties.name }));
      $('#labels').innerHTML = labelItems.map(l => `<span>${esc(l.name)}</span>`).join('');
      placeLabels();
    }
    // Biggest cities first; a label that would overlap one already placed is skipped
    function placeLabels() {
      const spans = $('#labels').children, c = map.getCenter(), placed = [];
      labelItems.forEach((l, i) => {
        const far = d3.geoDistance(l.lngLat, [c.lng, c.lat]) > 1.35; // on the far side of the globe
        const p = map.project(l.lngLat), s = spans[i];
        const box = { x: p.x + l.r + 4, y: p.y - 8, w: s.offsetWidth || l.name.length * 7, h: 16 };
        const clash = placed.some(b => box.x < b.x + b.w + 4 && b.x < box.x + box.w + 4 && box.y < b.y + b.h && b.y < box.y + box.h);
        const show = !far && !clash;
        if (show) placed.push(box);
        Object.assign(s.style, { left: `${box.x}px`, top: `${p.y}px`, display: show ? '' : 'none' });
      });
    }

    // Pins on the ranking's top five (renderRank sets them), placed on every move; hidden on the far side
    let pinList = [];
    const stateCentroid = new Map();
    function lngLatOf(n) {
      if (n.level === 'city') return [n.lon, n.lat];
      if (n.level === 'country') { const m = D.markets[n.code]; return m && Number.isFinite(m.lon) ? [m.lon, m.lat] : null; }
      if (n.level === 'state' && geo) { const f = geo.stateFeature.get(n.name);
        if (f && !stateCentroid.has(n.code)) stateCentroid.set(n.code, d3.geoCentroid(f)); return stateCentroid.get(n.code) || null; }
      return null;
    }
    function renderPins() {
      const items = pinList.filter(d => d.at), max = d3.max(items, d => Math.abs(d.v)) || 1;
      const html = items.map(d => `<div class="pin${d.k === st.focus ? ' cur' : ''}" data-key="${d.k.key}" style="--d:${Math.round(20 + 52 * Math.sqrt(Math.abs(d.v) / max))}px">
        <span class="halo"></span><span class="dot"></span><button type="button" class="pb" aria-label="${esc(d.k.name)}" title="${esc(d.k.name)}">${flag(d.k)}</button></div>`).join('');
      const box = $('#pins');
      if (box.dataset.html !== html) {
        box.dataset.html = html; box.innerHTML = html;
        box.querySelectorAll('.pin').forEach(el => { const node = nodeCache.get(el.dataset.key), b = el.querySelector('.pb');
          b.addEventListener('click', () => focus(node)); b.addEventListener('mouseenter', () => setHover(hitOf(node))); b.addEventListener('mouseleave', () => setHover(null)); });
      }
      placePins();
    }
    function placePins() {
      if (!mapReady) return;
      const c = map.getCenter(), els = $('#pins').children, items = pinList.filter(d => d.at), placed = [];
      items.forEach((d, i) => { const el = els[i]; if (!el) return;
        const far = d3.geoDistance(d.at, [c.lng, c.lat]) > 1.2, p = map.project(d.at);
        const clash = placed.some(q => Math.abs(q.x - p.x) < 46 && Math.abs(q.y - p.y) < 50); // a higher-ranked pin is there: skip
        if (!far && !clash) placed.push(p);
        Object.assign(el.style, { left: `${p.x}px`, top: `${p.y}px`, display: far || clash ? 'none' : '' }); });
    }

    const steps = s => `<div class="steps" style="--n:${s.colors.length}">${s.colors.map(c => `<i style="background:${c}"></i>`).join('')}</div>
      <div class="ticks">${s.breaks.map((b, i) => `<span style="left:${((i + 1) / s.colors.length * 100).toFixed(2)}%">${s.fmtB(b)}</span>`).join('')}</div>`;
    function renderLegend(level) {
      const el = $('#legend'), theme = lensTheme();
      el.hidden = false;
      if (theme) {
        const side = lensSide();
        el.innerHTML = `<div class="t">${vr(esc(theme))} ${SIDE[side].word} vs worldwide</div>${steps(lensScale(side))}
          <div class="note">Countries with ${MIN_REVIEWS}+ reviews since ${FIRST_YEAR}${industryOn() ? ` · ${esc(st.industry)}` : ''}</div>`;
        return;
      }
      const key = level === 'city' ? metricAt('city') : st.metric, m = METRICS[key];
      if (m.geoOnly && industryOn()) {
        el.innerHTML = `<div class="t">${m.label}</div><div class="note">Market size covers all industries, so ${lower(m)} is shown for all industries only.</div>`;
        return;
      }
      const s = scales[level], change = changeView(key);
      const hatch = 'background-image:repeating-linear-gradient(45deg,var(--ink-3) 0 1.5px,var(--land) 1.5px 4px)';
      const keys = [`<span><i style="background:var(--land)"></i>No data</span>`, `<span><i style="${hatch}"></i>Not entered</span>`];
      if (m.low || change) keys.push(`<span><i style="${hatch}"></i>${lowText(key)}</span>`);
      const title = change ? `Change in ${vr(lower(m))} vs ${vr(viewSlice().cmpLabel)}` : `${vr(m.label)} across ${vr(PLURAL[level].toLowerCase())}`;
      const scale = s.colors
        ? `${steps(s)}${key === 'penetration' ? `<div class="note">Top class: at or above the benchmark, ${s.fmtB(s.breaks.at(-1))} (no white space left)</div>` : ''}`
        : `<div class="bar" style="background:linear-gradient(90deg,${s.stops.join(',')})"></div><div class="ends">${s.ends.map(e => `<span>${e}</span>`).join('')}</div>`;
      el.innerHTML = `<div class="t">${title}${industryOn() ? ` · ${vr(esc(st.industry))}` : ''}</div>${scale}<div class="keys">${keys.join('')}</div>`;
    }

    // ---------------------------------------------------------------- KPI tiles: the metric switcher
    // Tiles show a change only when comparing: vs the end of the comparison range (point-in-time metrics)
    function deltaOf(key, row, n) {
      const m = METRICS[key], sl = viewSlice();
      if (!changeView(key) || !row || valueOf(key, row, n) == null) return null;
      const d = num(row[m.chg]);
      // "Sep 2025"; a rating covers the whole comparison range: "Jan – Sep 2025"
      const when = m.prev ? sl.cmpLabel.replace(/ \d+(?=[ ,])/g, '').replace(/,/g, '') : sl.cmpEnd.replace(/ \d+,/, '');
      if (d == null || !(num(row[m.prev ?? 'customers_prev']) > 0)) return { txt: 'New', cls: '', vs: `since ${when}` };
      return { txt: `${d >= 0 ? '↑' : '↓'} ${m.chgFmt(d)}`, cls: d >= 0 ? 'up' : 'dn', vs: `vs ${when}` };
    }
    function naText(key, row, n) {
      const m = METRICS[key];
      if (m.geoOnly && n.level === 'city') return 'Not for cities';
      if (m.geoOnly && industryOn()) return 'All industries only';
      if (!(num(row?.customers) > 0)) return 'Not entered';
      if (m.low && m.low(row)) return m.lowText;
      return '—';
    }

    // Display only: icons and flags (flag-icons uses ISO alpha-2)
    const ico = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const ICON = {
      penetration: ico('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
      white_space: ico('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
      customers: ico('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
      arr: ico('<path d="M3 3v18h18"/><path d="M8 17V11M13 17V7M18 17v-4"/>'),
      arpc: ico('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>'),
      rating: ico('<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>'),
    };
    const ISO2 = { ARE: 'ae', ARG: 'ar', AUS: 'au', AUT: 'at', BEL: 'be', BGD: 'bd', BGR: 'bg', BRA: 'br', CAN: 'ca', CHE: 'ch', CHL: 'cl', CHN: 'cn',
      COL: 'co', CZE: 'cz', DEU: 'de', DNK: 'dk', EGY: 'eg', ESP: 'es', FIN: 'fi', FRA: 'fr', GBR: 'gb', GHA: 'gh', GRC: 'gr', HKG: 'hk', HUN: 'hu',
      IDN: 'id', IND: 'in', IRL: 'ie', ISR: 'il', ITA: 'it', JPN: 'jp', KAZ: 'kz', KEN: 'ke', KOR: 'kr', LKA: 'lk', MAR: 'ma', MEX: 'mx', MYS: 'my',
      NGA: 'ng', NLD: 'nl', NOR: 'no', NZL: 'nz', PAK: 'pk', PER: 'pe', PHL: 'ph', POL: 'pl', PRT: 'pt', QAT: 'qa', ROU: 'ro', SAU: 'sa', SGP: 'sg',
      SRB: 'rs', SWE: 'se', THA: 'th', TUR: 'tr', TWN: 'tw', USA: 'us', VNM: 'vn', ZAF: 'za' };
    const flag = n => n.level === 'country' && ISO2[n.code] ? `<span class="fi fi-${ISO2[n.code]}"></span>`
      : n.level === 'state' ? `<span class="tag">${esc(n.code.replace('US-', ''))}</span>` : '<span></span>';

    const goldStar = t => t.replace('★', '<span class="star">★</span>'); // the rating's star in gold, its number in ink
    function renderKpis() {
      if (!st.view) return;
      const n = st.focus, row = rowsOf(n)[st.view];
      { // the selected metric, big, for the place in focus
        const k = st.metric, m = METRICS[k], v = valueOf(k, row, n), dl = deltaOf(k, row, n);
        $('#hero-head').innerHTML = `<div class="hl">${m.label}<button type="button" class="det" id="det">How it's calculated ›</button></div>
          <div class="big${v == null ? ' na' : ''}">${v == null ? naText(k, row, n) : goldStar(m.fmt(v))}</div>
          <div class="sub">${dl ? `<span class="${dl.cls}">${dl.txt}</span> ${esc(dl.vs)} · ` : ''}${esc(n.name)} · ${esc(viewSlice().label)}</div>`;
        $('#det').addEventListener('click', e => fx.open(`kpi:${k}`, e.currentTarget));
      }
      $('#kpis').innerHTML = TILES.map(k => {
        const m = METRICS[k], v = valueOf(k, row, n), dl = deltaOf(k, row, n);
        return `<div class="kpi" role="button" tabindex="0" data-metric="${k}" aria-pressed="${k === st.metric}"><span class="ic">${ICON[k]}</span>
          <span class="kv"><small>${m.label}</small><b class="${v == null ? 'na' : ''}">${v == null ? naText(k, row, n) : goldStar(m.fmt(v))}</b>${
          dl ? `<em class="${dl.cls}">${dl.txt} ${esc(dl.vs)}</em>` : ''}</span>
          ${fx.button(`kpi:${k}`, { corner: true, label: m.label })}</div>`;
      }).join('');
      $('#kpis').querySelectorAll('.kpi').forEach(el => {
        const pick = () => { if (el.dataset.metric !== st.metric || st.lens) { st.lens = st.lensSide = null; setMetric(el.dataset.metric); } };
        el.addEventListener('click', e => { if (!e.target.closest('.fx-btn')) pick(); });
        el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); pick(); } });
      });
    }

    // ---------------------------------------------------------------- "How it's calculated" (the shared panel: apps/shared/fx-panel.js)
    // For governance. An fx on each KPI tile opens the metric as the dataset defines it (description, AQL, its lineage from
    // the tile down to the tables), the filters behind the number and its query. On Size vs strength, an fx on each block
    // (a verdict tile, the chart, the capacity list) opens what the block reads, its lineage, the rules the app adds on top
    // (verdicts and blockers: set in this file, so not in the lineage), the filters and the app's queries.
    // Texts and formulas from coverage-globe.definitions.js; lineage from the catalog (the lineage plugin).
    // The filters behind the number on screen, set or not: the place in focus, the Date control (on snapshots and reviews,
    // as the app maps it) and Industry. type: the field's, for its icon; cond: as the query's filters block writes it
    const fxQuote = v => `'${String(v).replace(/'/g, "\\'")}'`;
    const fxDate = field => { const sl = viewSlice();
      return { field, type: 'date', active: true, value: `matches ${sl.from} - ${sl.to}`, cond: `${field} matches @${sl.from} - ${sl.to}`,
        source: 'date', from: 'Applied from the control "date" (the date presets and Custom)' }; };
    const fxIndustry = () => { const ind = st.ind || [];
      return { field: 'accounts.industry', type: 'text', active: ind.length > 0, value: ind.length ? `is ${ind.join(' ')}` : 'no selection',
        cond: ind.length && `accounts.industry in [${ind.map(fxQuote).join(', ')}]`, source: 'industry', from: 'Applied from the control "industry"' }; };
    function fxFilters(n) {
      const q = fxQuote;
      const place = { country: ['geo_countries.country_code', n.code], state: ['geo_states.state_code', n.code], city: ['geo_cities.city_id', n.id] }[n.level];
      return [
        { field: place?.[0] ?? 'geo_countries.country_code', type: place?.[0] === 'geo_cities.city_id' ? 'number' : 'text', active: !!place, value: place ? `is ${place[1]}` : 'not set',
          cond: place && `${place[0]} == ${typeof place[1] === 'number' ? place[1] : q(place[1])}`, source: 'focus',
          focus: true, from: `The place in focus (Country, the globe or the ranking)${place ? `: ${n.name}` : ''}. The app's queries fetch every place of a level at once and read its row; this query filters to it` },
        fxDate('account_snapshots.snapshot_at'), fxDate('reviews.created_at'), fxIndustry(),
      ];
    }
    // A query anyone can rerun for the number on screen: the metric and the filters that are set
    const rerunAql = (m, filters) => { const f = filters.filter(x => x.active).map(x => x.cond);
      return `explore {\n  measures { ${m.col}: ${m.def} }${f.length ? `\n  filters {\n    ${f.join(',\n    ')}\n  }` : ''}\n}`; };
    // The app's query the number came from: the level of the place in focus, in the set on screen
    const sourceQuery = n => sets.get(st.view)?.[{ world: 'world', country: 'countries', state: 'states', city: 'cities' }[n.level]];
    // A KPI tile: the metric on screen for the place in focus
    function kpiFx(k) {
      const m = METRICS[k], n = st.focus, row = rowsOf(n)[st.view], val = valueOf(k, row, n), filters = fxFilters(n);
      const na = val == null ? `${naText(k, row, n)}.` : null;
      const level = { world: 'the world', country: 'every country', state: 'every US state', city: 'every city' }[n.level];
      return { id: `kpi:${k}`, title: m.label, metric: m.def, value: `${val == null ? '—' : m.fmt(val)} · ${n.name}`, filters,
        queries: [{ query: sourceQuery(n), rerun: na ? undefined : rerunAql(m, filters), rerunEmpty: na || undefined,
          info: `This number: the metric alone, with the filters that are set; run it to get the number. Executed: the app's query it came from (${level} at once, every tile's metric), as it last ran.` }] };
    }
    const pctRule = v => `${+(v * 100).toPrecision(2)}%`, gapRule = v => `$${+(v / 1e6).toPrecision(3)}M`;
    // First match wins, in this order (verdictOf, blockerOf)
    const VERDICT_RULES = () => [
      ['enter', 'No customers at the end of the range'],
      ['defend', `Penetration ${pctRule(EXPAND_SHARE)} or more`],
      ['expand', `Penetration under ${pctRule(EXPAND_SHARE)}, white space ${gapRule(EXPAND_GAP)} or more`],
      ['hold', `Penetration under ${pctRule(EXPAND_SHARE)}, white space under ${gapRule(EXPAND_GAP)}`],
    ].map(([k, text]) => ({ k, label: VERDICTS[k].label, text }));
    const BLOCKER_RULES = () => [
      ['Not entered', 'No customers (an Enter market)'],
      ['Shrinking', 'Fewer customers than a year earlier (customers_yoy, in the app\'s query)'],
      ['A theme', `Complaints about one theme at ${BLOCK_X}× the worldwide rate or more, ${MIN_MENTIONS}+ complaints, ${BLOCK_REVIEWS}+ reviews since ${FIRST_YEAR}; the strongest by complaints × ln(ratio)`],
      ['Coverage gaps', 'United States: the two states with the most white space'],
      ['Near benchmark', 'A Defend market'],
      ['Low share', `Penetration under ${pctRule(LOW_SHARE)}`],
      ['Under-served', 'Any other market'],
    ].map(([label, text]) => ({ label, text }));
    // The blocks of Size vs strength (once its data is in): each verdict tile, the chart, the capacity list
    function svsFx() {
      if (!D.svs || !TH.ready || industryOn()) return [];
      const all = svsMarkets(), range = viewSlice().label, ran = "The app's query this block reads (every country at once), as it last ran.";
      const filters = reviews => [fxDate('account_snapshots.snapshot_at'), fxIndustry(), ...(reviews ? [{ field: 'reviews.created_at', type: 'date', active: false,
        value: `every review since ${FIRST_YEAR}`, source: 'none', from: 'Not filtered: a year has too few reviews per theme and country to compare' }] : [])];
      const verdicts = cur => ({ title: 'Verdicts', rows: VERDICT_RULES().map(r => ({ label: r.label, text: r.text, swatch: swatch(r.k), current: r.k === cur })) });
      const block = (id, title, text, metrics, value, rules, queries, reviews) => ({ id, title, code: 'Size vs strength', text: esc(text), metrics,
        value: `${value} · ${range}`, rules, filters: filters(reviews), queries: queries.map(([t, q]) => ({ title: t, query: q, info: ran })) });
      return [
        ...Object.entries(VERDICTS).map(([k, V]) => { const ms = all.filter(m => m.v === k);
          return block(`verdict:${k}`, V.label, 'Each country gets one verdict from its customers, penetration and white space: the first rule it meets.',
            ['customers', 'penetration', 'untapped_arr'], `${fMoney(d3.sum(ms, m => m.ws))} white space · ${ms.length} markets`, verdicts(k), [['Query', Q.verdicts]]); }),
        block('chart', 'Penetration against white space',

      text: esc('Every market (a country, or a US state), entered or not, with its companies of 50+ employees and the source of that figure. Penetration divides customers by it; white space starts from it. Not filtered by industry or date: market size covers all industries, at its source year.'),

      !st.view ? [] : st.page === 'svs' ? svsFx() : [...TILES.map(kpiFx), ...reviewsFx(), ...marketsFx()]);

    function renderSide() {

    // Where a place's market size comes from: its own market row, or every source behind a sum of markets

    function sizeSources(n) {
      const one = m => m && srcBadge(`${m.source} ${m.year}`, { estimate: m.source.startsWith('Estimate'), note: m.note, inspect: 'markets' });
      if (n.level === 'state') return one(D.market[n.code]) || '';
      if (n.level === 'country' && n.code !== 'USA') return one(D.market[n.code]) || '';

    // Above the ranking, for penetration and white space: the focused place's arithmetic (a country or US state, never

        <div class="src">${fInt(num(row.addressable))} companies with 50+ employees ${sizeSources(n)}</div></div>`;
    }
    // The sum behind penetration or white space for one place, from the columns its query returns
    function eqHtml(key, row, n) {
      const v = c => num(row[c]), cust = v('customers') ?? 0, addr = v('addressable');
      if (key === 'penetration') return `${fInt(cust)} customers ÷ ${fInt(addr)} companies = <b>${fPct(v('penetration') ?? 0)}</b>`;
      const bm = D.benchmark, ua = v('untapped') ?? 0, ws = v('white_space') ?? 0;
      const one = n.level === 'state' || (n.level === 'country' && n.code !== 'USA'), cm = n.level === 'state' ? D.markets.USA : D.markets[n.code];
      if (!one) return `${fInt(ua)} untapped accounts, each at its US expected ARR per customer = <b>${fMoney(ws)}</b>`;
      if (!(ua > 0)) return `${fBench(bm)} × ${fInt(addr)} − ${fInt(cust)} ≤ 0: at or above the benchmark, <b>no white space</b>`;
      return `${fBench(bm)} × ${fInt(addr)} − ${fInt(cust)} = ${fInt(ua)} accounts × ${fMoney(cm.expectedArpc)} = <b>${fMoney(ws)}</b>`;
    }

    // A market-size source badge opens where the figure comes from
    $('#side').addEventListener('click', e => { const b = e.target.closest('[data-fx-src]'); if (b) fx.open('q:markets', b); });
    $('#side').addEventListener('keydown', e => { const b = e.target.closest?.('[data-fx-src]'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); fx.open('q:markets', b); } });
    function renderRank(pane, scroll) {
      const n = st.focus, host = listHost(n), kids = childrenOf(host), level = kids[0]?.level || 'country', key = metricAt(level), m = METRICS[key], sl = viewSlice();
      const scale = scales[level];
      const list = kids.map(k => ({ k, v: shadeOf(key, rowsOf(k)[st.view], k) })).filter(d => d.v != null && (changeView(key) || d.v > 0)).sort((a, b) => b.v - a.v);
      const max = d3.max(list, d => Math.abs(d.v)) || 1, cur = list.findIndex(d => d.k === n);
      pinList = level === 'city' ? [] : list.slice(0, 5).map(d => ({ k: d.k, v: d.v, at: lngLatOf(d.k) })); renderPins(); // cities have their own bubbles and names
      const fallback = key !== st.metric ? `${METRICS[st.metric].label} has no city level (market size stops at countries and US states), so cities are ranked by customers.` : '';
      const where = host === WORLD ? '' : ` in ${vr(esc(host.name))}`;
      const note = fallback || (cur >= 0 ? `${esc(n.name)} is #${cur + 1} of ${list.length} · ${esc(sl.label)}` : `${list.length} ${PLURAL[level].toLowerCase()} · ${esc(sl.label)}`);
      let empty = `No ${PLURAL[level].toLowerCase()} with data by ${fDay(sl.to, true)}.`;

    // ---------------------------------------------------------------- Size vs strength: a page of its own
    // Every country by how much is left to win (white space) and how much Arcfield already holds (penetration), sorted
    // into four verdicts by two business thresholds, then each market's blocker and the play that follows from it.
    // One query of its own (declared when the page first opens), following the Date and Industry filters; market size covers all industries,
    // so the page needs All industries. Blockers read the review themes (every review since 2019, like the rating tabs).
    let svsDeclared = false;
    function svsQuery() {
      if (svsDeclared) return;
      svsDeclared = true; // first: declaring a query notifies subscribers (onData) synchronously, which asks again
      Q.verdicts = app.createQuery('verdicts', { dataset: DATASET, aql: `explore {
dimensions { code: geo_countries.country_code }
measures { customers: customers, penetration: penetration, white_space: untapped_arr,
  customers_yoy: safe_divide(customers, customers | relative_period(account_snapshots.snapshot_at, interval(-1 year))) - 1 }

      app.mapControl(industry, Q.verdicts, { field: 'accounts.industry' });
      app.mapControl(dateFilter, Q.verdicts, { field: 'account_snapshots.snapshot_at' });
      run();
    }
    const EXPAND_SHARE = 0.01, EXPAND_GAP = 20e6, LOW_SHARE = 0.0025; // penetration 1%, white space $20M, penetration 0.25%
    const VERDICTS = {
      expand: { label: 'Expand', rule: 'Under 1% share, $20M+ white space', color: 'var(--v-expand)' },
      defend: { label: 'Defend', rule: '1%+ share: keep, upsell, protect', color: 'var(--v-defend)' },
      hold: { label: 'Hold', rule: 'Smaller gap: test with partners', color: 'var(--v-hold)' },
      enter: { label: 'Enter', rule: 'No customers yet: the size of the prize', color: 'url(#svs-hatch)' },
    };
    const verdictOf = d => (!(d.customers > 0) ? 'enter' : d.pen >= EXPAND_SHARE ? 'defend' : d.ws >= EXPAND_GAP ? 'expand' : 'hold');
    const swatch = k => `<i class="sw ${k}"${k === 'enter' ? '' : ` style="background:${VERDICTS[k].color}"`}></i>`;

    // The blocker: shrinking customers first, then the complaint theme that stands out most (2x the worldwide rate or
    // more, 3+ complaints, 20+ reviews; weighed by complaints x ln(ratio), so many complaints at 3x and a few at 6x
    // compare fairly), then what the numbers say. The play follows from it.
    const BLOCK_X = 2, BLOCK_REVIEWS = 20;
    const THEME_SHORT = { 'Language & localization': 'Language' };
    const THEME_PLAY = {
      'Language & localization': 'Localize the product before adding reps.',
      Integrations: 'Build the integrations they ask for, then staff a team.',
      Performance: 'Fix in-region performance before adding capacity.',
      Pricing: 'Launch local pricing.',
      Onboarding: 'Fix onboarding before adding reps.',
      Support: 'Add local support hours.',
      'Ease of use': 'Fix the ease-of-use complaints before scaling sales.',
      Mobile: 'Fix the mobile app first.',
      Reporting: 'Close the reporting gaps first.',
    };
    function blockerOf(code, d, v) {
      if (v === 'enter') return { label: 'Not entered', play: 'Untouched: enter with a partner first.' };
      if (d.yoy != null && d.yoy < 0) return { label: 'Shrinking', cls: 'shrink',
        play: `Customers down ${Math.abs(d.yoy * 100).toFixed(0)}% in a year: stop the churn before chasing new logos.`, title: `${fSigned(d.yoy)} customers vs a year earlier` };
      const c = TH.countries[code], weight = t => t.complaints * Math.log(t.cx);
      const t = c && c.reviews >= BLOCK_REVIEWS && c.themes.filter(t => t.complaints >= MIN_MENTIONS && t.cx >= BLOCK_X).sort((a, b) => weight(b) - weight(a))[0];
      if (t) return { label: THEME_SHORT[t.theme] ?? t.theme, cls: 'theme', play: THEME_PLAY[t.theme] ?? `Fix ${t.theme.toLowerCase()} first.`,
        title: `${t.theme} complaints at ${t.cx.toFixed(1)}× the worldwide rate (${t.complaints} of ${fInt(c.reviews)} reviews since ${FIRST_YEAR})` };
      if (code === 'USA') { // the gap sits in a few states
        const top = Object.values(D.state).map(s => ({ name: s.name, ws: num(s.rows[st.view]?.white_space) || 0 })).sort((a, b) => b.ws - a.ws);
        if (top[1]?.ws > 0) return { label: 'Coverage gaps', play: `${top[0].name} (${fMoney(top[0].ws)}) and ${top[1].name} (${fMoney(top[1].ws)}) hold the most: add reps there.` };
      }

    const svsOn = m => !st.verdict || m.v === st.verdict;

    function setPage(p) {

    // A market from this page, on the globe: Overview, white space, flown to the country

    function renderSvs() {

    // Where to add capacity: every market with white space, biggest first, with its blocker and play
    function renderCap(all) {
      const cap = $('#cap'), sl = viewSlice(), V = VERDICTS[st.verdict], cur = countryOf(st.focus);
      const list = all.filter(m => m.ws > 0 && svsOn(m)).sort((a, b) => b.ws - a.ws);
      const scroll = cap.querySelector('.list')?.scrollTop;
      cap.innerHTML = `<h2>Where to add capacity${V ? ` · ${vr(V.label)}` : ''}</h2>${fx.button('cap', { corner: true })}
        <div class="note">${list.length} markets by white space · ${esc(sl.label)}</div>
        <div class="list">${list.length ? list.map((m, i) => `<button type="button" class="row${m.n === cur ? ' cur' : ''}" data-code="${m.code}">
          <span class="no">${i + 1}</span>${flag(m.n)}<span class="nm">${swatch(m.v)}<span>${esc(m.n.name)}</span></span><span class="v">${fMoney(m.ws)}</span>
          <span class="play">${esc(m.b.play)}</span><span class="bk ${m.b.cls || ''}"${m.b.title ? ` title="${esc(m.b.title)}"` : ''}>${esc(m.b.label)}</span></button>`).join('')

    // A row and its dot light up together
