# A local Postgres for the sample data. Load it with scripts/load_data.sh.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: eta, POSTGRES_PASSWORD: eta, POSTGRES_DB: eta }
    ports: ["127.0.0.1:5442:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eta -d eta"], interval: 2s, retries: 30 }
volumes:
  pgdata: {}
