<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wanderleaf Books</title>
<!-- Served by Caddy for every request without a valid wl_auth cookie, so everything is inline. -->
<style>
  :root { --ink: #3B3A45; --ink-soft: #5A5560; --paper: #FFFDF7; --blue: #4A6585; --bg: #ECEAE3; --line: #CFCAC0; --err: #A4432E; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 56px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 26px/1 Georgia, 'Times New Roman', serif; margin-bottom: 40px; }
  .brand svg { width: 44px; height: auto; }
  form { width: 100%; max-width: 420px; background: var(--paper); border-radius: 6px; box-shadow: 0 2px 12px rgba(59, 58, 69, 0.12); padding: 40px 32px 32px; text-align: center; }
  .lock { width: 52px; height: 52px; margin: 0 auto 18px; }
  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 600; }
  .sub { margin: 0 0 36px; color: var(--ink-soft); font-size: 14px; }
  input[type=password] { width: 100%; border: 0; border-bottom: 1.5px solid var(--line); background: none; padding: 8px 0; font: inherit; color: var(--ink); outline: none; }
  input[type=password]:focus { border-bottom-color: var(--blue); }
  .err { min-height: 20px; margin: 6px 0 0; color: var(--err); font-size: 13px; text-align: left; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0 34px; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  button { width: 100%; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: 600 15px/1 system-ui, sans-serif; padding: 12px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button:focus-visible, input[type=checkbox]:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" width="64" height="56"><ellipse cx="32" cy="52" rx="28" ry="3.5" fill="#3B3A45" opacity="0.12"/><rect x="8" y="38" width="48" height="12" rx="2" fill="#B5654A"/><rect x="8" y="38" width="5" height="12" fill="#9A5440"/><path d="M15 42 h36 M15 46 h30" stroke="#F4E3CF" stroke-width="1.2" opacity="0.7"/><rect x="12" y="27" width="42" height="11" rx="2" fill="#6E9A7A" transform="rotate(-3 33 32)"/><path d="M18 31.5 h30" stroke="#E6EFE3" stroke-width="1.2" opacity="0.8" transform="rotate(-3 33 32)"/><rect x="10" y="17" width="40" height="10" rx="2" fill="#4A6585" transform="rotate(2 30 22)"/><rect x="10" y="17" width="4" height="10" fill="#3B5270" transform="rotate(2 30 22)"/><path d="M17 22 h26" stroke="#DCE6F0" stroke-width="1.2" opacity="0.8" transform="rotate(2 30 22)"/><path d="M18 16 C24 10 30 10 32 13 C34 10 40 10 46 16 L46 18 C40 13 34 13 32 16 C30 13 24 13 18 18 Z" fill="#FFFDF7" stroke="#C9B48E" stroke-width="1"/><path d="M32 13 V16" stroke="#C9B48E" stroke-width="1"/><path d="M42 12 l2 -6 l2 6" fill="#D9694A"/></svg><span>Wanderleaf Books</span></div>
  <form id="gate">
    <svg class="lock" viewBox="0 0 52 52" aria-hidden="true"><path d="M17 23v-6a9 9 0 0 1 18 0v6" fill="none" stroke="#9AA6B5" stroke-width="4" stroke-linecap="round"/><rect x="11" y="23" width="30" height="22" rx="4" fill="var(--blue)"/><circle cx="26" cy="33" r="3" fill="#fff"/><path d="M26 35v4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h1>This link is password protected</h1>
    <p class="sub">Please enter your password to view it.</p>
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
    <p class="err" id="err" role="alert"></p>
    <label><input type="checkbox" id="remember"> Remember me for 7 days</label>
    <button type="submit">Submit</button>
  </form>
<script>
  // The cookie holds sha256(password); Caddy lets a request through only when it matches.
  const FLAG = 'wl-gate-tried';
  try { if (sessionStorage.getItem(FLAG)) { document.getElementById('err').textContent = 'That password isn’t right. Try again.'; sessionStorage.removeItem(FLAG); } } catch (e) {}
  document.getElementById('gate').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const bytes = new TextEncoder().encode(document.getElementById('pw').value);
    const hex = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');
    const keep = document.getElementById('remember').checked ? '; Max-Age=604800' : '';
    const secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = 'wl_auth=' + hex + '; Path=/; SameSite=Lax' + keep + secure;
    try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
    location.reload();
  });
</script>
</body>
</html>
