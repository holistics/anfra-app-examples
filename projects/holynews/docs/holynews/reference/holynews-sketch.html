<style>
/* Layout: a newspaper in five sections. Teaser strip, uppercase masthead, section nav; each section is its own page built from the same posts, deals and topics. */
:root {

  --sheet: #FBFCFD;
  --ink: #14171C;
  --ink-2: #4B525D;
  --muted: #858D99;
  --rule: #CDD3DB;
  --accent: #B3122E;
  --chart: #2B3038;
  --ph-a: #E4E7EB;
  --ph-b: #ECEEF1;
  --hi: #FFE36E;
  --hi-ink: #14171C;
  --up: #0F7F55;
  --down: #B5482F;
  --neu: #A7AFBA;
  --f-mast: "Playfair Display", Didot, Georgia, serif;
  --f-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1114; --sheet: #15181C; --ink: #ECEEF1; --ink-2: #AAB1BC; --muted: #7C8490;
    --rule: #2C323A; --accent: #FF6B7A; --chart: #C9CFD8; --ph-a: #1C2026; --ph-b: #22272E; --hi: #5E5214; --hi-ink: #FFF3B8; --up: #4FC58F; --down: #E58368; --neu: #59616C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1114; --sheet: #15181C; --ink: #ECEEF1; --ink-2: #AAB1BC; --muted: #7C8490;
  --rule: #2C323A; --accent: #FF6B7A; --chart: #C9CFD8; --ph-a: #1C2026; --ph-b: #22272E; --hi: #5E5214; --hi-ink: #FFF3B8; --up: #4FC58F; --down: #E58368; --neu: #59616C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-sans); font-size: 15px; line-height: 1.55;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

.sheet { max-width: 1180px; margin: 0 auto; background: var(--sheet); border: 1px solid var(--rule); padding: 18px clamp(16px, 3vw, 36px) 32px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--f-sans); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1, h3, .hl, .dek { font-family: var(--f-serif); }
p { margin: 0; }

/* Masthead */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.strip-item { min-width: 0; padding: 0 16px; border-left: 1px solid var(--rule); font-size: 12px; line-height: 1.4; color: var(--ink-2); }
.strip-item:first-child { padding-left: 0; border-left: 0; }
.strip-item .label { color: var(--accent); display: block; }
.strip-item b { display: block; font-family: var(--f-serif); font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.2; margin: 2px 0; }
.mast { text-align: center; padding: 14px 0 10px; }

<div class="sheet">

<script>
// ---------- DATA-START ----------
const N = 150;                    // days of history; index N-1 = Oct 15, 2026
const TODAY = new Date(2026, 9, 15);
const DAYS = { daily: 1, weekly: 7, monthly: 30 };

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// base: daily baseline; climb: fn of x in [0,1]; adds: values added to the last days (last element = today)
function makeSeries({ base = 0, climb, adds = [], seed = 1, noise = .18 }) {
  const r = rng(seed), out = [];
  for (let i = 0; i < N; i++) {
    let v = climb ? climb(i / (N - 1)) : base;
    v *= 1 + (r() - .5) * 2 * noise;
    const k = i - (N - adds.length);
    if (k >= 0) v += adds[k];
    out.push(Math.max(0, Math.round(v)));
  }
  return out;
}

const TOPICS = {
  dash: { name: 'New navigation', section: 'Product', channels: ['#product', '#design', '#product-announce', '#eng-frontend'],
    people: { daily: 26, weekly: 31, monthly: 34 }, nch: { daily: 3, weekly: 3, monthly: 4 },
    s: { base: 10, adds: [25, 170], seed: 3 },
    headline: 'The new navigation lands, and everyone has an opinion on the sidebar',
    dek: 'One sidebar for the whole app went live this morning. Design and Frontend are already trading notes on where things moved.',

function spark(vals, w = 96, h = 28, color = 'var(--chart)') {
  const max = Math.max(...vals, 1), step = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * step, h - 2 - (v / max) * (h - 5)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${line} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${color}"/></svg>`;
}

  const launches = inEd(LAUNCHES).sort((a, b) => b.claps - a.claps);
  const joiners = inEd(JOINERS);
  const fun = inEd(LEISURE).sort((a, b) => applause(b) - applause(a));
  const rows = ranked(state.ed);
  return { E: EDITIONS[state.ed], anns, deals, launches, joiners, fun, rows,
    arr: sum(deals.map(x => x.arr)),
    top: rows.filter(r => r.qualifies && r.growth >= 1.15),
    cooling: rows.filter(r => r.growth < .6 && r.usualPerDay >= 15),
    always: Object.values(TOPICS).filter(t => t.always).map(t => ({ t, ...stats(t, state.ed) })) };
}

function volumeChart(t) {
  const vals = last30(t), max = Math.max(...vals), W = 640, H = 190, padL = 38, padB = 22, padT = 26;
  const ceil = Math.ceil(max / 100) * 100 || 10, bw = (W - padL) / 30;
  const y = (v) => H - padB - (v / ceil) * (H - padB - padT);
  const ms = (t.moments || []).filter(m => m[0] >= N - 30);
  const font = 'font-family="Hanken Grotesk, sans-serif" font-size="11"';
  let g = '';
  [0, ceil / 2, ceil].forEach(v => { g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" ${font} fill="var(--muted)">${fmt(v)}</text>`; });
  vals.forEach((v, i) => { const isM = ms.some(m => m[0] === N - 30 + i); g += `<rect x="${padL + i * bw + 1.5}" y="${y(v)}" width="${bw - 3}" height="${Math.max(0, H - padB - y(v))}" fill="${isM ? 'var(--accent)' : 'var(--chart)'}" opacity="${isM ? 1 : .5}"><title>${dateOf(N - 30 + i)}: ${fmt(v)} messages</title></rect>`; });
  ms.forEach((m, k) => { const i = m[0] - (N - 30), cx = padL + i * bw + bw / 2, cy = Math.max(10, y(vals[i]) - 12); g += `<circle cx="${cx}" cy="${cy}" r="9" fill="var(--accent)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" ${font} font-weight="700" fill="var(--sheet)">${k + 1}</text>`; });
  [0, 14, 29].forEach(i => { g += `<text x="${padL + i * bw + bw / 2}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}" ${font} fill="var(--muted)">${dateOf(N - 30 + i)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Messages per day, last 30 days">${g}</svg>`;
}

function renderArticle() {
  const t = TOPICS[state.topic], r = stats(t, state.ed);
  const ms = (t.moments || []).filter(m => m[0] >= N - 30);
  const hb = (list) => { const m = Math.max(...list.map(x => x[1])); return list.map(([k, v]) => `<div class="hbar"><div class="top"><span>${k}</span><span class="num">${v}%</span></div><div class="track"><i style="width:${v / m * 100}%"></i></div></div>`).join(''); };
  const [p, n0, ng] = t.mood;
  const names = { front: 'the front page', company: 'Company', business: 'Business', trending: 'Trending', leisure: 'Life & Leisure' };
  return `<div class="view">
    <button class="back" data-go="${state.from}">← Back to ${names[state.from]}</button>
    <div class="row c21 art" style="border:0">
      <div>
        <span class="label">${t.section} · ${EDITIONS[state.ed].span} · AI summary</span>
        <h1>${t.headline}</h1>
        <p class="dek">${t.dek}</p>
        <div class="tldr"><span class="label">In short</span><ul>${(t.tldr || [t.dek]).map(s => `<li>${s}</li>`).join('')}</ul></div>
        <div class="sec-head"><h2>How the story unfolded</h2><span class="src">messages per day, last 30 days</span></div>
        <div class="chart-box">${volumeChart(t)}</div>
        ${ms.length ? `<ol class="moments">${ms.map((m, k) => `<li><span class="dot">${k + 1}</span><span class="d">${dateOf(m[0])}</span><span class="w"><b>${m[1]}</b><span>${m[2]}</span></span><span class="n">${fmt(t.series[m[0]])} msgs · ${slackLink(t.channels[0], 'Thread', t.id + m[1])}</span></li>`).join('')}</ol>` : ''}
      </div>
      <aside class="side">
        <section><div class="sec-head"><h2>By the numbers</h2></div>
          <div class="stat-grid">
            <div class="stat"><div class="v">${fmt(r.msgs)}</div><div class="k">messages</div></div>
            <div class="stat"><div class="v">${r.people}</div><div class="k">people</div></div>
            <div class="stat"><div class="v">${r.nch}</div><div class="k">channels</div></div>
            <div class="stat"><div class="v x ${xClass(r.growth)}">${fx(r.growth)}</div><div class="k">vs usual</div></div>
          </div></section>
        <section><div class="sec-head"><h2>Where it's discussed</h2></div><div class="actions">${t.channels.map(chLink).join('')}</div></section>
        <section><div class="sec-head"><h2>Mood</h2></div>
          <div class="mood"><i style="width:${p}%;background:var(--up)"></i><i style="width:${n0}%;background:var(--neu)"></i><i style="width:${ng}%;background:var(--down)"></i></div>
          <div class="mood-key"><span style="--c:var(--up)">${p}% positive</span><span style="--c:var(--neu)">${n0}% neutral</span><span style="--c:var(--down)">${ng}% negative</span></div></section>
        <section><div class="sec-head"><h2>Key themes</h2></div>${hb(t.themes)}</section>
        <section><div class="sec-head"><h2>Who's talking</h2></div>${hb(t.depts)}<p class="privacy">By department. Individuals are never named or ranked.</p></section>
      </aside>
    </div></div>`;
}

const PAGES = { front: renderFront, company: renderCompany, business: renderBusiness, trending: renderTrending, leisure: renderLeisure, article: renderArticle };
function render() {
  const x = edition();
  renderChrome(x);
  $('#view').innerHTML = PAGES[state.view](x);
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const ed = e.target.closest('[data-ed]'); if (ed) { state.ed = ed.dataset.ed; render(); return; }
  const sec = e.target.closest('[data-section]'); if (sec) { state.section = sec.dataset.section; render(); return; }
  const tp = e.target.closest('[data-topic]');
  if (tp) { if (state.view !== 'article') state.from = state.view; state.topic = tp.dataset.topic; state.view = 'article'; render(); window.scrollTo({ top: 0 }); return; }
  const go = e.target.closest('[data-go]');
  if (go) { state.view = go.dataset.go; render(); window.scrollTo({ top: 0 }); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-topic]')) e.target.click(); });
render();
</script>
