    const qs = Object.entries(app.queries);

    // ---- Overview

    // ---- Structure
    function renderStructure(s) {

    // ---- Data
    const matches = (search, ...texts) => !search || texts.some(t => t?.toLowerCase().includes(search));
    const showQuery = (a, name, q) => (ui.view.filter !== 'errors' || q.state === 'error') && (ui.view.filter !== 'dirty' || q.isDirty) && matches(ui.view.search.trim().toLowerCase(), name, a.declaration.queries[name]?.dataset);

    function sub(key, title, inner, { count, info, action = '', open: dflt = true } = {}) {

    }

          return `<tr><td><div class="cell">${typeIcon(ficon, fkind)}<span class="med" style="word-break:break-all">${esc(f.field)}</span></div></td>
            <td><span class="${f.value === 'not set' || f.value === 'no selection' ? 'mfg' : ''}">${esc(f.value)}</span>${f.pending ? `<div class="xs tone-warn">pending: ${esc(f.pending)}</div>` : ''}</td>
            <td><div class="cell"${tip(from, 'left')}>${ico(f.kind === 'declared' ? 'table' : f.kind === 'control' ? 'sliders' : 'chart')}${src}</div></td></tr>`;
        }).join('');
        return fields([
          ['Trust', `<span class="med tone-${trust.tone}">Level ${trust.level} · ${esc(TRUST_LEVELS[trust.level].name)}</span><span class="mfg" style="display:block">${esc(trust.text)}</span>`],
          ['Dataset', `<span style="display:inline-flex;align-items:center;gap:6px">${ico('box', 's35 mfg')}${esc(decl?.dataset || 'none declared')}</span>`],
          lastRun.length && ['Last run', lastRun.join(' · ')],
          ['On the page', drawn(s, 'query', appIndex, name)],
          ['Cross-filters', mapsTo(`${key}|cross`, appIndex, crossFilterTargets(a, name), '<span class="mfg">No query</span>')],
          q.selectedRowCount > 0 && ['Selected', `${q.selectedRowCount} rows`],
          (q.hasMore || q.page > 1) && ['Page', `${q.page}${q.hasMore ? ', more available' : ''}`],
        ])
        + (q.columns.length ? colList('Metrics', q.columns.filter(c => c.isMeasure)) + colList('Dimensions', q.columns.filter(c => !c.isMeasure))
          : sub(key, 'Definition', `<p class="xs mfg" style="margin:0">${notRun === 'Not run yet.' ? 'Known once it runs.' : 'No fields.'}</p>`))
        + (allFilters.length ? sub(key, 'Filters', filters.length ? `<div class="list"><table class="mini"><tbody>${filterRows}</tbody></table></div>` : '<p class="xs mfg" style="margin:0">No active filters.</p>', {
          count: filters.length,
          action: `<div class="seg sm">${[['active', `Active (${active.length})`], ['all', `All (${allFilters.length})`]].map(([v, l]) => `<button data-act="filter-view" data-arg="${esc(`${key}|${v}`)}" aria-pressed="${fv === v}">${l}</button>`).join('')}</div>`,
        }) : '')
        + sub(key, 'Query', codeBlock(key, {
          declared: { label: 'Declared AQL', code: decl?.aql && dedent(decl.aql), lang: 'aql', empty: 'Not declared.' },
          aql: { label: 'Executed AQL', code: q.debug?.executedAql, lang: 'aql', empty: notRun },
          sql: { label: 'Executed SQL', code: q.debug?.executedSql, lang: 'sql', empty: window.Anfra?.user?.permissions?.canViewGeneratedSql === false ? 'Needs canViewGeneratedSql.' : notRun },
          signature: { label: 'Signature', code: prettyJson(q.signature), empty: 'No signature.' },
        }, false, 'aql'), { info: 'The AQL the query declares and the AQL, SQL and signature of its last run.', open: false })
        + (reqs.length ? sub(key, 'Requests', requestList(key, reqs), { info: 'What the app asked of the data source for this query, newest first.', count: reqs.length, open: false }) : '');
      });
    }
    function requestList(key, reqs) {
      const all = ui.showAll.has(key), shown = all ? reqs : reqs.slice(0, FIRST);
      return `<div><ul class="list">${shown.map(r => {
        const open = ui.reqOpen.has(r.id);
        const summary = [r.fromCache === undefined ? undefined : r.fromCache ? 'cache' : 'database', r.page > 1 ? `page ${r.page}` : undefined, r.status === 'ok' ? `${r.numRows ?? 0} rows` : r.status !== 'pending' ? r.status : undefined].filter(Boolean).join(' · ');
        const input = Object.fromEntries(Object.entries({ dataset: r.dataset, page: r.page, pageSize: r.pageSize, timezone: r.timezone, ...r.input }).filter(([, v]) => v !== undefined && !(Array.isArray(v) && !v.length)));
        return `<li class="req ${open ? 'open' : ''}"><button data-act="req" data-arg="${r.id}" aria-expanded="${open}">${ico('chev')}<span class="dot d-${r.status}"></span><span class="med tnum" style="flex-shrink:0">${esc(formatTime(r.at))}</span>
          <span class="trunc mfg">${esc(summary)}</span><span class="mfg tnum" style="margin-left:auto;flex-shrink:0;padding-left:8px">${r.durationMs === undefined ? '…' : `${r.durationMs} ms`}</span></button>
          ${open ? `<div class="req-b">${r.error ? `<p class="xs tone-error" style="margin:0">${esc(r.error)}</p>` : ''}${r.preview ? preview(r) : ''}${codeBlock(`req:${r.id}`, { input: { label: 'Input', code: JSON.stringify(input, null, 2), lang: 'js', empty: 'No input.' } })}</div>` : ''}</li>`;
      }).join('')}</ul>${reqs.length > FIRST ? `<button class="link" data-act="show-all" data-arg="${esc(key)}">${all ? 'Show fewer' : `Show all ${reqs.length}`}</button>` : ''}</div>`;
    }
    function preview(r) {
      const cell = v => (v === null || v === undefined ? '∅' : typeof v === 'object' ? JSON.stringify(v) : String(v));
      const n = r.preview.length;
      return `<div><p class="xs mfg" style="margin:0 0 4px">${!n ? 'No rows.' : r.numRows > n ? `First ${n} of ${r.numRows} rows` : plural(n, 'row')}</p>
        ${n ? `<div class="prev"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.preview.map(row => `<tr>${row.map(v => `<td>${esc(cell(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}</div>`;
    }
    function controlRow(s, a, appIndex, name, k) {
      const key = entityKey('control', appIndex, name), decl = a.declaration.filters[name] ?? a.declaration.dateDrills[name], targets = controlTargets(a, name);
      const filter = decl && 'field' in decl ? decl : undefined, options = filter?.options ?? k.options;
      const summary = `<span class="med" style="flex-shrink:0">${esc(name)}</span><span class="trunc xs mfg">${k.condition.values?.length ? esc(formatCondition(k.condition)) : ''}</span>
        ${k.isDirty ? '<span class="flag-dirty">unapplied</span>' : ''}<span class="grow"></span>
        ${isChanged(a, name, k) ? `<span class="m-badge" role="img" aria-label="Changed from the default"${tip('Changed from the default value')}>M</span>` : ''}
        <span class="side"${tip(targets.length ? `Applies to ${targets.length === 1 ? '1 query' : `${targets.length} queries`}\n${targets.map(t => `${t.query} on ${t.field}`).join('\n')}` : 'Applies to no query', 'left')}>${targets.length}${ico('table', 's35')}</span>`;
      return entityRow(key, summary, '', () => fields([
        ['Kind', `${k.kind === 'dateDrill' ? 'Date drill' : 'Filter'}${filter?.field ? `<span class="mfg"> on ${esc(filter.field)}</span>` : ''}${filter?.type ? `<span class="mfg"> · ${esc(filter.type)}</span>` : ''}`],
        decl?.label && ['Label', esc(decl.label)],
        ['Set to', esc(formatCondition(k.condition))], ['Applied', esc(formatCondition(k.appliedCondition))],
        decl?.default && ['Default', esc(typeof decl.default === 'string' ? decl.default : formatCondition(decl.default))],
        options ? ['Options', expandable(`${key}|options`, `${options.length} ${filter?.options ? 'fixed' : 'loaded'}`, `<ul class="chips">${options.map(o => `<li class="${(k.condition.values ?? []).map(String).includes(String(o)) ? 'on' : ''}">${esc(String(o))}</li>`).join('')}</ul>`)]
          : k.kind === 'filter' && ['Options', '<span class="mfg">Not loaded</span>'],
        ['Maps to', mapsTo(`${key}|maps`, appIndex, targets)],
        ['On the page', drawn(s, 'control', appIndex, name)],
      ]));
    }
    function selectionCard(label, sel) {
      return `<div class="selcard"><p class="med" style="margin:0">${label}${sel.lossy ? '<span class="xs tone-warn" style="margin-left:6px;font-weight:400">lossy</span>' : ''}</p>
        ${sel.lossy ? '<p class="xs tone-warn" style="margin:0 0 4px">Some selected values can\'t be expressed as a filter, so the queries it filters see less than was selected.</p>' : ''}
        ${fields([['From', esc(sel.source)], ['Rows', sel.rowCount], sel.expression && ['Expression', `<code>${esc(sel.expression)}</code>`], ...sel.conditions.map(c => [c.field, esc(formatCondition(c))])])}</div>`;
    }

    // ---- Wiring
    function renderWiring(s, checks) {
      if (!s.apps.length) return `<div class="p2">${note("This Data App hasn't created an SDK app.")}</div>`;
      const icon = { error: ico('circleAlert', 's35 tone-error'), warn: ico('triangle', 's35 warn-ic'), info: ico('info', 's35 mfg') };
      return `<div class="p2 g" style="gap:24px">${s.apps.map((a, i) => {
        const { queries, filters, dateDrills } = a.declaration, maps = controlMappings(a), crosses = crossFilters(a);
        const qn = Object.keys(queries), cn = [...Object.keys(filters), ...Object.keys(dateDrills)];
        const code = declarationCode(a), cs = checks[i] ?? [];
        return `<section class="g" style="gap:16px">${s.apps.length > 1 ? `<p class="med" style="margin:0;padding:0 4px">App ${i + 1} · ${esc(a.title || 'Untitled')}</p>` : ''}
          <div style="display:flex;flex-wrap:wrap;gap:4px;padding:0 4px">${[[qn.length, 'queries'], [cn.length, 'controls'], [maps.length, 'mappings'], [crosses.length, 'cross-filters']].map(([n, l]) => `<span class="badge-o">${n} ${l}</span>`).join('')}</div>
          ${qn.length ? `<div><span class="sect-title">Wiring ${hint('Which controls and cross-filters feed which queries, as declared by the app.')}</span><div class="matrix"><table><thead><tr><th>query</th>${cn.map(c => `<th>${elink('control', i, c)}</th>`).join('')}<th>cross-filtered by</th></tr></thead>
            <tbody>${qn.map(q => { const by = crosses.filter(c => c.to.name === q).map(c => c.from.name); return `<tr><td>${elink('query', i, q)}</td>${cn.map(c => { const m = maps.find(x => x.from.name === c && x.to.name === q); return `<td class="c">${m ? `<span style="cursor:default"${tip(`${m.field}${m.aggregation ? ` (${m.aggregation})` : ''}`)}>●</span>` : '<span class="mfg" style="opacity:.5">·</span>'}</td>`; }).join('')}<td class="mfg">${esc(by.length ? by.join(', ') : '—')}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
          <div><span class="sect-title">Checks ${hint('Static checks on the declaration for mistakes the SDK reports late or never, such as cross-filters across datasets or controls mapped to no query. Click a row to jump to it.')}</span>
            ${cs.length ? `<ul class="items">${cs.map((c, j) => `<li data-check="${i}:${j}"><button class="item ${c.level === 'info' ? 'info' : ''}" data-act="reveal" data-arg="${esc(JSON.stringify({ entity: c.about.entity, app: i, name: c.about.name }))}">${icon[c.level]}<span>${esc(c.message)}</span></button></li>`).join('')}</ul>` : `<div style="margin-top:6px">${note('No issues found.')}</div>`}</div>
          <div><span class="sect-title">Declaration ${hint("The app's queries, controls and mappings, as code reconstructed from what the Data App declared.")}</span><div style="margin-top:4px">${codeBlock(`decl:${i}`, { js: { label: 'JS', code: code || undefined, lang: 'js', empty: 'Nothing declared.' } }, true)}</div></div>
        </section>`;
      }).join('')}</div>`;
    }

    // ---- tooltips
    let tipTimer, tipFor;
    function showTip(el) {
      tipFor = el;
      tipEl.textContent = el.getAttribute('data-tip');
      tipEl.classList.add('on');
      const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect(), side = el.getAttribute('data-side') || 'top', vw = innerWidth, vh = innerHeight;
      let x, y;
      if (side === 'left') { x = r.left - t.width - 6; y = r.top + r.height / 2 - t.height / 2; }
      else if (side === 'right') { x = r.right + 6; y = r.top + r.height / 2 - t.height / 2; }
      else { x = r.left + r.width / 2 - t.width / 2; y = side === 'bottom' || r.top - t.height - 6 < 4 ? r.bottom + 6 : r.top - t.height - 6; }
      tipEl.style.left = `${Math.max(4, Math.min(x, vw - t.width - 4))}px`;
      tipEl.style.top = `${Math.max(4, Math.min(y, vh - t.height - 4))}px`;
    }
    function hideTip() { clearTimeout(tipTimer); tipFor = undefined; tipEl.classList.remove('on'); }
    root.addEventListener('pointerover', e => {
      const el = e.target.closest?.('[data-tip]');
      if (el === tipFor) return;
      hideTip();
      if (el) tipTimer = setTimeout(() => showTip(el), 300);
      const n = e.target.closest?.('[data-node]');
      if (n && !ui.picking) highlightNode(n.getAttribute('data-node'));
    });
    root.addEventListener('pointerleave', () => hideTip(), true);
    bodyEl.addEventListener('pointerleave', () => { if (!ui.picking) hideBoxes(); });
    bodyEl.addEventListener('scroll', hideTip, { passive: true });

    // ---- events
    async function copy(text, mark) {
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch {}
      if (!ok) { try { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove(); } catch {} }
      ui.copied = ok ? mark : mark === '#report' ? '#report-logged' : undefined;
      if (!ok) console.log(text);
      render();
      setTimeout(() => { ui.copied = undefined; render(); }, 1600);
    }
    function report() {
      return JSON.stringify({
        inspector: VERSION, capturedAt: new Date().toISOString(), host: { name: 'in-app', sdkVersion: window.Anfra?.version },
        reader: window.Anfra?.user && { name: Anfra.user.name, email: Anfra.user.email, role: Anfra.user.role, timezone: Anfra.user.timezone, permissions: Anfra.user.permissions },
        apps: snap.apps.map(a => ({ ...a, trust: appTrust(a), checks: wiringChecks(a) })),
        structure: { problems: problemNodes(snap.structure.nodes).map(n => ({ node: n.key, handle: handleFor(n), problems: n.problems })) },
        requests: log.map(({ preview: _p, t0: _t, ...r }) => r),
      }, null, 2);
    }
    root.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
      const json = () => JSON.parse(arg);
      switch (act) {
        case 'tab': ui.tab = arg; persist(); render(); break;
        case 'close': setOpen(false); break;
        case 'pick': setPicking(!ui.picking); break;
        case 'report': copy(report(), '#report'); break;
        case 'status': reveal({ tab: 'data', filter: arg }); break;
        case 'reveal': e.stopPropagation(); reveal(json()); break;
        case 'filter': ui.view = { ...ui.view, filter: arg }; render(); break;
        case 'section': toggleIn(ui.closed, arg); render(); break;
        case 'row': toggleIn(ui.openRows, arg); render(); break;
        case 'sub': { const open = ui.subs.has(arg) ? ui.subs.get(arg) : el.getAttribute('data-default') === 'true'; ui.subs.set(arg, !open); render(); break; }
        case 'exp': toggleIn(ui.exp, arg); render(); break;
        case 'code-tab': { const i = arg.lastIndexOf('|'); ui.codeTabs.set(arg.slice(0, i), arg.slice(i + 1)); render(); break; }
        case 'filter-view': { const i = arg.lastIndexOf('|'); ui.filterView.set(arg.slice(0, i), arg.slice(i + 1)); render(); break; }
        case 'req': toggleIn(ui.reqOpen, Number(arg)); render(); break;
        case 'show-all': toggleIn(ui.showAll, arg); render(); break;
        case 'issues-all': ui.issuesAll = !ui.issuesAll; render(); break;
        case 'coll': toggleIn(ui.colls, arg); render(); break;
        case 'copy': e.stopPropagation(); copy(arg, arg); break;
        case 'locate-entity': { const t = json(); locateEntity(t.kind, t.app, t.name); break; }
        case 'locate-node': locateNode(arg); break;
        case 'twist': e.stopPropagation(); toggleIn(ui.collapsed, arg); render(); break;
        case 'node': ui.selected = arg; locateNode(arg); render(); break;
      }
    });
    root.addEventListener('keydown', e => {
      if (e.target.matches?.('[data-search]') && e.key === 'Escape') { e.stopPropagation(); ui.view = { ...ui.view, search: '' }; render(); }
      else if (e.key === 'Enter' && e.target.matches?.('.node')) { ui.selected = e.target.getAttribute('data-node'); locateNode(ui.selected); render(); }
      else if (e.target.matches?.('.tab[role=tab]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
        const ids = ['overview', 'structure', 'data', 'wiring'], i = ids.indexOf(ui.tab);
        ui.tab = ids[e.key === 'Home' ? 0 : e.key === 'End' ? 3 : (i + (e.key === 'ArrowRight' ? 1 : 3)) % 4];
        persist(); render(); root.querySelector('.tab[aria-selected=true]')?.focus();
      }
    });
    root.addEventListener('input', e => { if (e.target.matches('[data-search]')) { ui.view = { ...ui.view, search: e.target.value }; render(); } });

    // resizing: drag the left edge; 220px to 60% of the window
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add('on');
      const move = ev => {
        ui.width = Math.round(Math.max(220, Math.min(innerWidth * 0.6, innerWidth - ev.clientX)));
        host.style.setProperty('--w', `${ui.width}px`);
        document.documentElement.style.setProperty('--inspector-w', `${ui.width}px`);
      };
      const up = () => { grip.classList.remove('on'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); persist(); };
      grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
    });

    // the page: data-inspect elements, and Alt+Shift+I
    document.addEventListener('click', e => {
      const el = e.target.closest?.('[data-inspect]');
      if (!el || ui.picking) return;
      const name = el.getAttribute('data-inspect');
      if (!name) return setOpen(!ui.open);
      reveal({ entity: 'query', app: 0, name, code: true });
    });
    if (options.shortcut !== false) {
      document.addEventListener('keydown', e => {
        if (e.altKey && e.shiftKey && !e.metaKey && !e.ctrlKey && e.code === 'KeyI') { e.preventDefault(); setOpen(!ui.open); }
      });
    }
    app.subscribe(() => { track(); schedule(); });
    track();

    return {
      open: name => (name ? reveal({ entity: 'query', app: 0, name, code: true }) : setOpen(true)),
      close: () => setOpen(false),
      toggle: () => setOpen(!ui.open),
      get isOpen() { return ui.open; },
    };
  }

  return { mount, highlight, version: VERSION }; // highlight: AQL or SQL as HTML, for a page that shows code the same way
})();

  <script>/* fx-panel.js, inlined */
/*
  fx-panel.js: "How it's calculated" for Data Apps, shared across apps.

  An fx button on a tile or panel opens a panel docked on the right (the page narrows beside it) that explains that
  block for governance: what it shows, the dataset metrics and fields it reads (each opens its definition: description,
  AQL, its own lineage), its lineage from the widget down to the database tables (a fitted preview; expand opens it in
  full in a modal), the rules the app adds on top, and the filters and queries behind it, laid out as the inspect panel
  shows a query. Lineage comes from the catalog when the lineage plugin is on (`Anfra.lineage`), filled in from the
  definitions' references (the catalog drops some); without the plugin, from the references alone.
  Ported from Global Market Coverage's formula panel.

  Use it:
    1. Export the dataset's definitions:
         uv run scripts/shared/export_definitions.py <dataset> apps/<app>.definitions.js <VAR>
    2. Load both before the app's script:
         <script src="<app>.definitions.js"><\/script>
         <script src="../shared/fx-panel.js"><\/script>       (the path from the app's folder)
    3. const fx = FxPanel.create({ defs: VAR, blocks: () => blocks, onOpen?: (id) => {}, folded?: [section] });
       folded: sections that start folded, so the panel opens on its plain words and sums and the rest is one click
       away: 'reads' (metrics and fields), 'definition' (a metric's AQL), 'lineage', 'rules', 'filters', 'queries'.
       (or block: (id) => block, for blocks made on demand, such as one per room)
       A block, recomputed as results change (blocks() runs on every refresh; text, numbers and swatches are HTML the
       app writes, so escape data values):
         { id, title,
           text?: HTML,                       what the block shows (a block without `metric`)
           metric?: 'name',                   a tile of one metric: the panel opens on its definition
           metrics?: [name], fields?: ['model.field'],   what the block reads: listed, and the roots of its lineage
           value?: 'text',                    the widget card's second line in the lineage (the number, the place)
           numbers?: HTML,                    "On screen now": the sums behind the numbers
           code?: 'text', kind?: 'text',      the line under the title (default: the dataset, then · kind)
           rules?: { title, note?, rows: [{ label, text, swatch?: HTML, current?: true }] },   logic set in the app
           trace?: node,                      a number worked out in the app, step by step down to governed metrics:
             { label, value, formula?, calc?, app?: true, badges?: ['override: …'], metric?, field?, query?, children?: [node] }
             (its metrics and fields are the lineage's roots; its nodes' queries are the Query sections, unless given)
           filters?: [{ field, type: 'text'|'number'|'date', active, value, source, from?, focus?: true }],
           queries?: [{ title?, info?, query?: AnfraQuery, aql?, sql?, rerun?: AQL, rerunEmpty?: 'why not' }],
           aql? }                             (the query as it ran: same as queries: [{ aql }])
       A query's tabs: This number (rerun, when given), Executed AQL and Executed SQL (from query.result.debug, or aql/sql).
    4. Put fx.button(id) into the tile or panel header (fx.button(id, { corner: true }) pins it to the corner and shows it
       on hover; the host needs position: relative). Call fx.refresh() at the end of each render: it redraws only what
       changed and closes the panel when its block is gone (another tab, another page).

  Style it per app with CSS variables on :root (each has a default):
    --fx-surface, --fx-ink, --fx-muted, --fx-faint, --fx-line, --fx-accent, --fx-accent-soft, --fx-accent-line,
    --fx-code-bg, --fx-chip-bg, --fx-warn, --fx-warn-soft, --fx-font, --fx-mono, --fx-width, --fx-radius, --fx-shadow, --fx-z,
    lineage cards: --fx-lg-metric, --fx-lg-field, --fx-lg-dataset, --fx-lg-model,
    code: --fx-syn-kw, --fx-syn-str, --fx-syn-num, --fx-syn-fn (set them again for dark mode)
  e.g. :root { --fx-accent: var(--accent); --fx-surface: var(--surface); }  and dark mode follows the app's tokens.
*/

        const on = el.dataset.fx === st.id;
        el.classList.toggle('open', on); el.setAttribute('aria-expanded', on);
      });
    }
    function open(id, opener) {
      st.id = id; st.path = []; st.opener = opener || null; st.view = null;
      box.hidden = false; document.documentElement.setAttribute('data-fx-open', '');
      onOpen?.(id); // the app may redraw (and refresh) here
      if (st.id !== id) return;
      render(true); markButtons(); box.scrollTop = 0;
    }
    function close() {
      const opener = st.opener;
      st.id = null; st.path = []; st.opener = null; st.html = st.view = null;
      box.hidden = true; document.documentElement.removeAttribute('data-fx-open');
      if (modal.open) modal.close();
      markButtons();
      if (opener && document.contains(opener)) opener.focus();
    }
    const go = (fn) => { fn(); render(true); box.scrollTop = 0; };
    async function copyCode(text) {
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch {}
      if (!ok) { try { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove(); } catch {} }
      if (!ok) return console.log(text);
      ui.copied = text; render(true);
      setTimeout(() => { if (ui.copied === text) { ui.copied = null; render(true); } }, 1600);
    }
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.fx-btn[data-fx]');
      if (btn) { e.stopPropagation(); if (st.id === btn.dataset.fx) close(); else open(btn.dataset.fx, btn); return; }
      if (modal.contains(e.target)) {
        if (e.target === modal || e.target.closest('[data-fx-close]')) return modal.close(); // the backdrop, the x
        const t = e.target.closest('[data-fx-def]'); // a metric: its definition in the panel
        if (t) { modal.close(); go(() => st.path.push(t.dataset.fxDef)); }
        return;
      }
      if (!box.contains(e.target)) return;
      if (e.target.closest('.fx-lgbox')) return openLineage();
      const u = e.target.closest('[data-fx-sub], [data-fx-view], [data-fx-tab], [data-fx-copy]');
      if (u) {
        const d = u.dataset;
        if (d.fxSub) ui.flipped.has(d.fxSub) ? ui.flipped.delete(d.fxSub) : ui.flipped.add(d.fxSub);
        else if (d.fxView) ui.filters = d.fxView;
        else if (d.fxTab) { const [id, t] = d.fxTab.split(':'); ui.tab[id] = t; }
        else return copyCode(u.closest('.fx-q').querySelector('pre').textContent);
        return render(true);
      }
      const t = e.target.closest('[data-fx-def], [data-fx-back], [data-fx-close]');
      if (!t) return;
      if (t.dataset.fxDef) go(() => st.path.push(t.dataset.fxDef));
      else if ('fxBack' in t.dataset) go(() => st.path.pop());
      else close();
    }, true);
    document.addEventListener('keydown', (e) => {
      if (box.hidden || modal.open) return; // the modal closes itself on Escape
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('.fx-panel .fx-lgbox')) { e.preventDefault(); return openLineage(); }
      if (e.key !== 'Escape') return;
      e.stopImmediatePropagation(); e.preventDefault();
      if (st.path.length) go(() => st.path.pop()); else close();
    }, true);

    return {
      // The fx button for a block: inline after a title, or { corner: true } in its host's corner, shown on hover
      button: (id, { corner = false, label } = {}) => {
        const name = label || blockOf(id)?.title || id;
        return `<button type="button" class="fx-btn${corner ? ' fx-corner' : ''}${st.id === id ? ' open' : ''}" data-fx="${esc(id)}" aria-expanded="${st.id === id}" aria-label="How ${esc(name)} is calculated">fx</button>`;
      },
      refresh() { if (st.id) render(); markButtons(); },
      open, close,
      isOpen: () => !!st.id,
      openId: () => st.id,
    };
  }
  window.FxPanel = { create, highlight };
})();

  <style>
    /* Light by default; .dark on <html> (from the OS) switches every token, Basecoat's included. Map colors are read from here at paint time.

       page with a white embossed planet, and a near-black one with a purple planet and teal pins; the data ramps are ours. */
    :root {
      --bg: #f4f4fa; --sheet: #ffffff; --ink: #27244f; --ink-2: #6b6889; --ink-3: #a3a1bb; --line: #e6e5f0;
      --sea: #dddce9; --grat: #d4d3e3; --land: #f2f1f8; --edge: #ffffff;
      --q1: #e9e5fc; --q2: #cac1f5; --q3: #a495ec; --q4: #8169dc; --q5: #6046c4; --q6: #3c2890;
      --w1: #fcefdd; --w2: #f9ddb8; --w3: #f3c08a; --w4: #e89a55; --w5: #c9702a; --w6: #8f4512;
      --g1: #e3f4ea; --g2: #bfe5cc; --g3: #8fd0a8; --g4: #5bb57f; --g5: #2f8f5a; --g6: #17643c;
      --div-mid: #eeeae2; --hi: #5b45d9; --hi-soft: #efecfd; --hi-line: #cbc2f6; --good: #1d8a4e; --bad: #c23a2f; --star: #d97706;
      /* Size vs strength verdicts (Enter is hatched): categorical, not the blue ramp, so Expand and Defend tell apart; Hold a
         neutral gray dark enough to see on white. Checked with the dataviz skill's validator (all pairs, light and dark) */

      --stage: radial-gradient(circle at var(--gx, 55%) var(--gy, 55%), #ffffff 0%, #f8f8fc 38%, var(--bg) 70%); --glow: rgb(110 95 210 / .16); --limb: rgb(60 50 140 / .16); --shine: rgb(255 255 255 / .35);
      --orbit: rgb(110 95 210 / .12); --relief-shade: rgb(52 44 110 / .4); --relief-land: rgb(70 62 130 / .62); --relief-light: rgb(255 255 255 / 1);
      --pin: #6a55e0; --pin-glow: rgb(106 85 224 / .22); --tile: linear-gradient(135deg, #8d74ff, #5b45d9);
      --float: 0 1px 2px rgb(72 60 160 / .04), 0 6px 18px rgb(72 60 160 / .05);
      --f-ui: "Geist", system-ui, -apple-system, sans-serif;
      --f-num: "Geist Mono", ui-monospace, Menlo, monospace;

      --secondary: #f0eff8; --secondary-foreground: var(--ink); --muted: #f0eff8; --muted-foreground: var(--ink-2);
      --accent: #f0eff8; --accent-foreground: var(--ink); --border: var(--line); --input: var(--line); --ring: var(--hi);
      --radius: 0.5rem; --card-r: 16px; /* 8px spacing scale: 8 12 16 24 */

    }
    /* Dark: Orion's night (near black, a purple planet), the data ramp in lavender to match the accent; white space and praise keep amber and green */
    html.dark {
      --bg: #0c0b15; --sheet: #17152a; --ink: #f1f0fa; --ink-2: #9d9ab8; --ink-3: #6d6a88; --line: #29263f;
      --sea: #1b1832; --grat: #262243; --land: #3a3456; --edge: #17152a;
      --q1: #2c2655; --q2: #3c3379; --q3: #5646a6; --q4: #7a68cf; --q5: #a594ee; --q6: #d4cbff;
      --w1: #2c2013; --w2: #4a3016; --w3: #6f461c; --w4: #a0621f; --w5: #e08a3a; --w6: #ffc27a;
      --g1: #13261b; --g2: #183b28; --g3: #1f5a39; --g4: #2f8052; --g5: #55b67f; --g6: #9be3b8;
      --div-mid: #34304a; --hi: #b5abfc; --hi-soft: #2b2645; --hi-line: #5d5294; --good: #5fd08f; --bad: #f08379; --star: #fbbf24;
      --v-expand: #8a78e0; --v-defend: #1fa676; --v-hold: #6a6a70;
      --stage: radial-gradient(circle at var(--gx, 55%) var(--gy, 55%), #241d45 0%, #15122a 40%, var(--bg) 72%); --glow: rgb(140 100 255 / .30); --shine: rgb(255 255 255 / .06); --limb: rgb(0 0 0 / .45);
      --orbit: rgb(160 140 255 / .10); --relief-shade: rgb(4 2 14 / .65); --relief-land: rgb(4 2 14 / .7); --relief-light: rgb(214 204 255 / .4);
      --pin: #22d3b4; --pin-glow: rgb(34 211 180 / .28); --tile: linear-gradient(135deg, #b25cff, #7a3ff0);
      --float: 0 6px 18px rgb(0 0 0 / .25);
      --primary: #ebe9f5; --primary-foreground: #16142a;
      --secondary: #221f38; --muted: #221f38; --accent: #221f38;

    }
    * { box-sizing: border-box; }

    .trig .lbl { color: var(--muted-foreground); font-weight: 400; }

    .custom-pop .input { height: 32px; font-size: 13px; color: var(--foreground); }

    /* Left column (Orion's "All users 7,541,390"): where you are, the selected metric as a big number, then every metric

    .hero { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 0; overflow-y: auto; padding: 18px 20px 18px; border-radius: 20px;
            border: 1px solid var(--line); box-shadow: var(--float); background: color-mix(in srgb, var(--sheet) 94%, transparent); backdrop-filter: blur(10px); }

    .kpis { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 18px; }

    /* No card (Orion): the globe is the page's backdrop, from under the title to the bottom edge, framed between the left

    .main { position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr) 372px; gap: 24px; min-height: 0; pointer-events: none; }
    .main > .left, .main > .side { pointer-events: auto; position: relative; z-index: 3; }
    .left { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
    /* The legend is the left card's footer: it explains the colors of the metric above it */

    .pin .dot { position: absolute; width: 14px; height: 14px; left: -7px; top: -7px; border-radius: 50%; background: var(--pin); border: 3px solid var(--sheet); }
    .pin .pb { position: absolute; left: -20px; bottom: 16px; width: 40px; height: 40px; border-radius: 13px; border: 0; padding: 0; background: var(--sheet);
               box-shadow: var(--float); display: grid; place-items: center; cursor: pointer; pointer-events: auto; transition: transform .15s; }
    .pin .pb::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 10px; height: 10px; margin-left: -5px; background: var(--sheet); transform: rotate(45deg); border-radius: 2px; }
    .pin .pb:hover { transform: translateY(-2px); }
    .pin.cur .pb { box-shadow: 0 0 0 2px var(--hi), var(--float); }
    .pin .fi { width: 22px; height: 16px; border-radius: 3px; position: relative; z-index: 1; box-shadow: 0 0 0 1px rgb(0 0 0 / .08); }
    .pin .tag { position: relative; z-index: 1; font-size: 11px; font-weight: 700; color: var(--hi); }
    html.dark .pin .halo { border: 1px solid color-mix(in srgb, var(--pin) 45%, transparent); box-shadow: 0 0 0 10px color-mix(in srgb, var(--pin) 7%, transparent); }
    html.dark .pin .dot { border-color: color-mix(in srgb, var(--pin) 35%, var(--bg)); box-shadow: 0 0 14px var(--pin); }

    .ov { position: absolute; z-index: 3; }
    .card-ov { background: color-mix(in srgb, var(--sheet) 92%, transparent); backdrop-filter: blur(8px); border: 0; border-radius: 14px; box-shadow: var(--float); }
    .crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; max-width: calc(100% - 300px); padding: 4px; }
    .crumbs button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 4px 9px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; }

    .legend { padding: 12px 16px; display: grid; gap: 7px; width: 250px; max-width: calc(100% - 80px); }

    .legend .bar { height: 10px; border-radius: 999px; }
    .legend .steps { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; height: 10px; }
    .legend .steps i { border-radius: 2px; }
    .legend .steps i:first-child { border-radius: 999px 2px 2px 999px; } .legend .steps i:last-child { border-radius: 2px 999px 999px 2px; }
    .legend .ticks { position: relative; height: 13px; font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .legend .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    .legend .ends { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 10.5px; color: var(--ink-2); }
    .legend .keys { display: flex; gap: 10px; font-size: 10.5px; color: var(--ink-2); flex-wrap: wrap; }
    .legend .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }

    .zoom { right: calc(var(--pad-r, 420px) + 8px); bottom: 24px; display: grid; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--float); overflow: hidden; }
    .zoom .btn { background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    .zoom .btn + .btn { border-top: 1px solid var(--line); }
    /* The pinned theme lens, on the globe */
    .lensc { right: calc(var(--pad-r, 420px) + 8px); top: var(--pad-t, 130px); display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; font-size: 12.5px; color: var(--ink-2); }
    .lensc[hidden] { display: none; }
