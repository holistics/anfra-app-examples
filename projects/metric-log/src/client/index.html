<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>metric log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
// Apply the saved theme, or the system's, before the page paints so there is no flash.
(function () { try { var t = localStorage.getItem('theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = 'light'; } })();
</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <b class="brand"><span class="logo"></span>metric log</b>
  <span class="concept" title="No sign-in: the switcher stands in for it. Drafts are simulated for three sentences. Slack sends nothing.">Concept</span>
  <div class="hright">
    <button class="iconbtn" id="bell" data-open="notifications" title="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg><span class="n" id="bellcount" hidden></span></button>
    <button class="iconbtn" data-open="settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="iconbtn" id="theme" title="Switch to dark mode" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
    <div class="as"><span>Viewing as</span><div id="as-dd"></div></div>
  </div>
</header>
<div class="app">
  <section id="canvas">
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <div class="filters">
      <div id="dataset-dd" hidden></div>
      <span class="fpill">As of <b id="asof">…</b></span>
      <div id="period-dd"></div>
    </div>
    <div class="zoom">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit to screen">Fit</button>
    </div>
    <div id="mode" hidden></div>
    <div id="cstatus">Loading metrics from Anfra…</div>
  </section>
  <aside id="panel"><div id="view"></div></aside>
</div>
<script src="/chart.js"></script>
<script src="/datepicker.js"></script>
<script src="/app.js"></script>
</body>
</html>
