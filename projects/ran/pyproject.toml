[project]
name = "garmin-sync"
version = "0.1.0"
description = "Fetch Garmin Connect data into Postgres for Anfra"
requires-python = ">=3.12"
dependencies = [
    "garminconnect",
    "curl_cffi",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "numpy>=2.0",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garmin_sync"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
