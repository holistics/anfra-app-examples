    }

    // Penetration (log) across, white space up, dot size = customers. The verdict lines split the plane; markets with
    // no customers have no penetration to plot, so they stand in a lane of their own at the left.
    function renderChart(all) {
      const chart = $('#chart'), sl = viewSlice(), bm = D.benchmark, cur = countryOf(st.focus);
      chart.innerHTML = `<h2>Penetration against white space · ${vr('countries')}</h2>${fx.button('chart', { corner: true, label: 'the chart' })}
        <div class="note">Dot size is customers · ${esc(sl.label)} · click a market to see it on the globe</div><div class="plot"></div><div class="tip" hidden></div>`;
      const plot = chart.querySelector('.plot'), W = plot.clientWidth, H = plot.clientHeight;
      if (!(W > 0 && H > 0)) return;
      const mg = { l: 52, r: 18, t: 22, b: 40 }, lane = 70, x0 = mg.l + lane + 12;
      const inn = all.filter(m => m.v !== 'enter'), out = all.filter(m => m.v === 'enter');
      const x = d3.scaleLog().domain([(d3.min(inn, m => m.pen) || 1e-4) / 1.5, Math.max(d3.max(inn, m => m.pen) || 0, bm || 0) * 1.35]).range([x0, W - mg.r - 14]); // room for the biggest dots on the right
      const y = d3.scaleSqrt().domain([0, (d3.max(all, m => m.ws) || 1) * 1.15]).range([H - mg.b, mg.t]);
      const r = d3.scaleSqrt().domain([0, d3.max(all, m => m.customers) || 1]).range([3.5, 26]);
      const g = d3.select(plot).append('svg').attr('width', W).attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
        .attr('aria-label', `Penetration against white space for ${all.length} countries`);
      g.append('defs').html(`<pattern id="svs-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${css('--land')}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${css('--ink-3')}" stroke-width="1.4"/></pattern>`);

    function renderCrumbs() {
      const chain = []; for (let n = st.focus; n; n = n.parent) chain.unshift(n);
      const globeIco = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2.2 2 10.8 0 13M8 1.5c-2 2.2-2 10.8 0 13"/></svg>';
      $('#crumbs').innerHTML = chain.map((c, i) => `${i ? '<span>›</span>' : ''}<button type="button" data-key="${c.key}" aria-current="${c === st.focus}">${i ? '' : globeIco}${esc(c.name)}</button>`).join('');
      $('#crumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        const t = b.dataset.key === 'world' ? WORLD : nodeCache.get(b.dataset.key);
        if (t !== st.focus) focus(t);
      }));
      const country = countryOf(st.focus);
      setTrigger('country-dd', country ? country.name : 'All', !!country);
      $('#country-dd [role=menu]').querySelectorAll('[data-v]').forEach(it => it.setAttribute('aria-checked', String(it.dataset.v === (country?.code ?? ''))));
    }
    // Every market, entered or not, by name (a camera move, not a data filter: the numbers are the same)
    function renderCountryMenu() {
      const list = Object.values(D.markets).sort((a, b) => a.name.localeCompare(b.name));
      $('#country-dd [role=menu]').innerHTML = radioItems([['', 'All'], ...list.map(m => [m.code, esc(m.name)])], countryOf(st.focus)?.code ?? '');
    }
    $('#country-dd [role=menu]').addEventListener('click', e => { const it = e.target.closest('[data-v]'); if (it) focus(it.dataset.v ? countryNode(it.dataset.v) : WORLD); });

    // ---------------------------------------------------------------- navigation
    const DURATION = reduceMotion ? 0 : 1400;
    function fly(n) {
      // Fit into the clear middle between the cards: the zoom for a box that size, from even padding (MapLibre's globe
      // camera fails on lopsided padding), then the map's own padding moves it between the cards
      const mp = map.getPadding(), cv = map.getCanvas(), w = cv.clientWidth - mp.left - mp.right, h = cv.clientHeight - mp.top - mp.bottom;
      const sx = (cv.clientWidth - w) / 2 + 30, sy = (cv.clientHeight - h) / 2 + 40;
      const pad = { top: sy, bottom: sy, left: sx, right: sx };
      if (n.level === 'world') return map.flyTo({ center: [map.getCenter().lng, 20], zoom: worldZoom(20), duration: DURATION });
      if (n.level === 'city') return map.flyTo({ center: [n.lon, n.lat], zoom: Math.max(map.getZoom(), 7.5), duration: DURATION });
      let b = null;
      if (n.level === 'country') { const f = geo.countryFeature.get(n.code); b = BOUNDS[n.code] || (f && mainBounds(f)); }
      if (n.level === 'state') { const f = geo.stateFeature.get(n.name); b = f && mainBounds(f); }
      if (!b || (b[1][0] - b[0][0]) * (b[1][1] - b[0][1]) < 1.5) {
        const m = n.level === 'country' ? D.markets[n.code] : null;
        if (!b && !m) return; // a state before its shape is known by name: stay put
        const c = b ? [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2] : [m.lon, m.lat];
        return map.flyTo({ center: c, zoom: 7.5, duration: DURATION });
      }
      let cam = null;
      try { cam = map.cameraForBounds(b, { padding: pad, maxZoom: 6.5 }); } catch { cam = null; }
      map.flyTo({ ...(cam || { center: [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2], zoom: 3 }), bearing: 0, duration: DURATION });
    }
    function focus(n) {
      if (!n) return;
      st.focus = n;
      if (inUS(n)) wantLevel('states');
      if (cityParent(n)) wantLevel('cities');
      hideTip();
      render();
      if (geo) fly(n);
    }
    const up = () => { if (st.focus.parent) focus(st.focus.parent); };
    function render() { paint(); renderKpis(); renderSide(); renderCrumbs(); fx.refresh(); placeCallout(); renderSvs(); }

    // ---------------------------------------------------------------- hover and click
    const tip = $('#tip');
    function nodeAt(point) {
      const layers = ['cities', 'points', 'states-fill', 'countries-fill'].filter(l => map.getLayoutProperty(l, 'visibility') !== 'none');
      const f = map.queryRenderedFeatures(point, { layers })[0];
      if (!f) return null;
      if (f.layer.id === 'cities') return { node: cityNode(f.properties.id), src: 'cities', id: f.properties.id };
      if (f.layer.id === 'points') return { node: countryNode(f.properties.code), src: 'points', id: f.properties.code };
      if (f.layer.id === 'states-fill') {
        const s = Object.values(D.state).find(x => x.name === f.properties.name);
        return s ? { node: stateNode(s.code), src: 'states', id: f.properties.name } : null;
      }
      const code = D.isoToCode[f.properties.iso];
      if (!code || (code === 'USA' && map.getLayoutProperty('states-fill', 'visibility') !== 'none')) return code ? null : { node: null, name: f.properties.name, src: 'countries', id: f.properties.iso };
      return { node: countryNode(code), src: 'countries', id: f.properties.iso };
    }
    function siblingsRanked(n, metric) {
      if (!n.parent) return [];
      return childrenOf(n.parent).map(k => ({ k, v: shadeOf(metric, rowsOf(k)[st.view], k) }))
        .filter(d => d.v != null).sort((a, b) => b.v - a.v);
    }
    function tipHtml(hit) {
      if (!hit.node) return `<b>${esc(hit.name || 'Unknown')}</b><span class="dim">Not an Arcfield market</span>`;
      const n = hit.node, theme = lensTheme();
      if (theme && n.level === 'country') {
        const side = lensSide(), v = lensVal(n.code, theme, side), c = TH.countries[n.code];
        return `<b>${esc(n.name)}</b><span>${esc(theme)} ${SIDE[side].word}: ${v == null ? 'too few reviews' : `${v.toFixed(1)}× global`}</span><span class="dim">${fInt(c?.reviews || 0)} reviews since ${FIRST_YEAR}</span>`;
      }
      const key = metricAt(n.level), m = METRICS[key], row = rowsOf(n)[st.view], sl = viewSlice();
      const has = num(row?.customers) > 0, v = valueOf(key, row, n);
      let txt = v != null ? m.fmt(v) : has ? naText(key, row, n) : `No customers by ${fDay(sl.to, true)}`;
      if (changeView(key) && v != null) { const c = shadeOf(key, row, n); txt += c != null ? ` (${m.chgFmt(c)} vs ${sl.cmpEnd})` : ` (${lowText(key).toLowerCase()})`; }
      const sibs = siblingsRanked(n, key), idx = sibs.findIndex(d => d.k === n);
      const size = n.level === 'country' && !has ? `<span class="dim">${fInt(D.markets[n.code].addressable)} companies with 50+ employees</span>` : '';
      return `<b>${esc(n.name)}</b><span>${m.label}: ${txt}</span>${idx >= 0 ? `<span class="dim">#${idx + 1} of ${sibs.length} ${PLURAL[n.level].toLowerCase()}</span>` : ''}${
        key !== 'customers' && has ? `<span class="dim">${fInt(num(row.customers))} customers</span>` : ''}${size}`;
    }
    // The map feature that draws a place (for hover from a ranking row or a scatter dot)
    let pointCodes = new Set();
    function hitOf(n) {
      if (!n) return null;
      if (n.level === 'city') return { src: 'cities', id: n.id, node: n };
      if (n.level === 'state') return { src: 'states', id: n.name, node: n };
      const iso = D.markets[n.code]?.iso;
      return pointCodes.has(n.code) ? { src: 'points', id: n.code, node: n } : iso ? { src: 'countries', id: iso, node: n } : null;
    }
    let hovered = null;
    function setHover(hit) {
      if (!mapReady) return;
      if (hovered && (!hit || hovered.src !== hit.src || hovered.id !== hit.id)) map.setFeatureState({ source: hovered.src, id: hovered.id }, { hover: false });
      if (hit) map.setFeatureState({ source: hit.src, id: hit.id }, { hover: true });
      hovered = hit;
      const key = hit?.node?.key; // a globe hover lights its ranking row
      document.querySelectorAll('.rank button').forEach(b => b.classList.toggle('hl', !!key && b.dataset.key === key));
    }
    const hideTip = () => { tip.hidden = true; setHover(null); map.getCanvas().style.cursor = ''; };
    map.on('mousemove', e => {
      if (!mapReady || !D.world[st.view]) return; // (st.view is declared before its rows arrive)
      const hit = nodeAt(e.point);
      if (!hit) return hideTip();
      holdSpin(2500);
      setHover(hit);
      map.getCanvas().style.cursor = hit.node ? 'pointer' : '';
      tip.innerHTML = tipHtml(hit); tip.hidden = false;
      const w = $('#stage').clientWidth, h = $('#stage').clientHeight;
      tip.style.left = `${Math.min(e.point.x + 14, w - tip.offsetWidth - 8)}px`;
      tip.style.top = `${Math.min(e.point.y + 14, h - tip.offsetHeight - 8)}px`;
    });
    map.getCanvas().addEventListener('mouseleave', hideTip);
    map.on('click', e => { const hit = mapReady && D.world[st.view] && nodeAt(e.point); if (hit?.node && hit.node !== st.focus) focus(hit.node); });
    map.on('dragstart', hideTip);

    // ---------------------------------------------------------------- idle spin
    // At world level the globe turns slowly eastward. Hovering a place or touching the map holds it for a few seconds.
    const SPIN_DEG_PER_S = 3; // a full turn in two minutes
    let spinOn = !reduceMotion, spinHoldUntil = 0, spinLast = 0;
    function holdSpin(ms) { spinHoldUntil = Math.max(spinHoldUntil, performance.now() + ms); }
    function setSpin(on) { spinOn = on && !reduceMotion; }
    for (const ev of ['mousedown', 'touchstart', 'wheel', 'drag', 'zoom']) map.on(ev, e => { if (e.originalEvent) holdSpin(4000); }); // user input only, not our own camera moves
    requestAnimationFrame(function spin(t) {
      const dt = spinLast ? Math.min(t - spinLast, 100) : 0;
      spinLast = t;
      if (spinOn && mapReady && st.page === 'overview' && st.focus === WORLD && t > spinHoldUntil && !map.isEasing()) {
        const c = map.getCenter();
        map.setCenter([c.lng - SPIN_DEG_PER_S * dt / 1000, c.lat]);
      }
      requestAnimationFrame(spin);
    });

    $('#zin').addEventListener('click', () => map.zoomIn());
    $('#zout').addEventListener('click', () => map.zoomOut());
    $('#zre').addEventListener('click', () => fly(st.focus));
    // Esc: closes the popover, then clears the lens, then goes up a level (Esc inside the inspect panel stays there;
    // Basecoat closes an open menu or dialog itself; the fx panel takes it first while open)
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || e.target.closest?.('[data-inspector]') || document.querySelector('[data-popover][aria-hidden=false]') || document.querySelector('dialog[open]')) return;
      if (st.lens) clearLens(); else up();
    });

    // ---------------------------------------------------------------- metric (the KPI tiles), date range, comparison
    function setMetric(k) {
      st.metric = k; st.lensHover = null;
      if (k === 'rating') themeQueries();
      showRange();
      if (!citiesShown() && st.focus.level === 'city') focus(st.focus.parent); // up to the country or state that has the number
      else { if (cityParent(st.focus)) wantLevel('cities'); render(); } // a market focused under white space: its cities now
      lensChanged();
    }
    // Filters read "Label Value" (Basecoat dropdown-menu and popover: Basecoat opens, closes and handles the keyboard)
    function setTrigger(id, val, on) { const b = $(`#${id} .trig`); b.querySelector('.val').textContent = val; b.classList.toggle('on', !!on); }
    const radioItems = (items, cur) => items.map(([v, label]) => `<div role="menuitemradio" data-v="${v}" aria-checked="${v === cur}">${label}</div>`).join('');

    // The controls say what they apply: the exact dates are the active preset's tooltip (the list's note shows them too)
    const fMonth = ym => fDay(`${ym}-01`, true).replace(/ 1,/, '');
    const CMP_LABEL = { none: 'None', prev: 'Previous period', year: 'Same period last year' };
    const CMP_ITEMS = [['none', 'None'], ['prev', 'Previous period'], ['year', 'Same period last year'], ['years:2', '2 years ago'], ['years:3', '3 years ago']];
    function showRange() {
      const cur = sliceDefs.get(st.view); if (!cur) return;
      $('#range').querySelectorAll('button').forEach(b => { b.title = b.dataset.range === st.range ? cur.label : ''; });
      $('#custom-label').textContent = st.range === 'custom' && st.from && st.to ? `${fMonth(st.from)} – ${fMonth(st.to)}` : 'Custom';
      const off = METRICS[st.metric].noCompare;
      $('#cmp-dd .trig').disabled = !!off;
      setTrigger('cmp-dd', off ? 'None' : CMP_LABEL[st.cmp] ?? `${st.cmpN} years ago`, !off && st.cmp !== 'none');
      $('#cmp-dd .trig').title = off ? `No comparison for ${lower(METRICS[st.metric])}` : cur.cmpLabel ? `Compared with ${cur.cmpLabel}` : '';
      $('#cmp-dd [role=menu]').innerHTML = radioItems(CMP_ITEMS, st.cmp === 'years' ? `years:${st.cmpN}` : st.cmp);
    }
    // The chosen range goes to the Date filter (anfra applies it to snapshots and reviews); the comparison picks the set
    function applyRange() {
      if (!D.asOf) return;
      st.asOf = D.asOf; // the cut-off this range counts back from (onData re-applies when meta brings another)
      $('#from').min = $('#to').min = `${FIRST_YEAR}-01`; $('#from').max = $('#to').max = D.asOf.slice(0, 7);
      const r = rangeOf(st.range), [from, to] = r || [`${FIRST_YEAR}-01-01`, D.asOf];
      const shift = { none: 0, prev: r ? monthsIn(from, to) : 0, year: 12, years: 12 * st.cmpN }[st.cmp];
      const sl = { key: `v${shift}`, from, to, shift, label: r ? fRange(from, to) : `All time, to ${fDay(D.asOf, true)}` };
      if (shift) { const f = addMonths(ymOf(from), -shift), t = addMonths(ymOf(to), -shift);
        sl.cmpEnd = fDay(monthEnd(...t), true); sl.cmpLabel = r ? fRange(`${f[0]}-${pad2(f[1])}-01`, monthEnd(...t)) : sl.cmpEnd; }
      sliceDefs.set(sl.key, sl);
      st.view = sl.key; // before setCondition: it notifies subscribers (onData) synchronously
      // All time is sent as 2019 to the cut-off too (all the data): relative_period needs a range to shift.
      // Before querySet: a new set runs at once, and execute sends the filter as it stands then
      dateFilter.setCondition({ operator: 'matches', values: [`${from} - ${to}`] });
      querySet(shift);
      run();
      showRange(); onData();
    }
    // Date presets: a Basecoat button-group; the chosen one is the filled (default) button
    function markRange() {
      $('#range').querySelectorAll('[data-range]').forEach(b => {
        const on = b.dataset.range === st.range;
        if (on) b.removeAttribute('data-variant'); else b.dataset.variant = 'outline';
        b.setAttribute('aria-pressed', String(on));
      });
    }
    $('#range').addEventListener('click', e => {
      const b = e.target.closest('button[data-range]'); if (!b) return;
      st.range = b.dataset.range;
      if (st.range === 'custom' && !st.from) {
        const [f, t] = rangeOf('ytd'); st.from = $('#from').value = f.slice(0, 7); st.to = $('#to').value = t.slice(0, 7);
      }
      markRange(); applyRange();
    });
    markRange();
    for (const id of ['from', 'to']) $(`#${id}`).addEventListener('change', e => { st[id] = e.target.value; if (st.from && st.to && st.from <= st.to) applyRange(); });
    function setCompare(kind, n) {
      if (n) st.cmpN = clamp(Math.round(+n) || 3, 2, 7);
      st.cmp = kind;
      applyRange();
    }
    $('#cmp-dd [role=menu]').addEventListener('click', e => { const it = e.target.closest('[data-v]'); if (it) { const [k, n] = it.dataset.v.split(':'); setCompare(k, n); } });

    // Industry: multi-select in a Basecoat popover (search, checkboxes, Clear / Done)
    let industryOptions = null;
    function setIndustries(list) {
      st.ind = list;
      st.industry = !list.length ? '' : list.length === 1 ? list[0] : `${list.length} industries`;
      setTrigger('ind-pop', st.industry || 'All', list.length > 0);
      industry.setCondition({ operator: 'is', values: list });
      run();
    }
    function renderIndustryList() {
      const pop = $('#ind-pop'), term = pop.querySelector('input[type=search]').value.trim().toLowerCase(), list = pop.querySelector('.ind-list');
      if (!industryOptions) { list.innerHTML = '<div class="empty">Loading options…</div>'; return; }
      const shown = industryOptions.filter(o => o.toLowerCase().includes(term));
      list.innerHTML = shown.length ? shown.map(o => `<label><input type="checkbox" class="input" value="${esc(o)}" ${st.ind.includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('') : '<div class="empty">No matches</div>';
    }
    $('#ind-pop input[type=search]').addEventListener('input', renderIndustryList);
    $('#ind-pop .ind-list').addEventListener('change', e => {
      if (e.target.type === 'checkbox') setIndustries(e.target.checked ? [...st.ind, e.target.value] : st.ind.filter(v => v !== e.target.value));
    });
    $('#ind-pop footer').addEventListener('click', e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'clear') { setIndustries([]); renderIndustryList(); }
      if (act === 'done') $('#ind-pop .trig').click();
    });
    st.ind = [];
    setTrigger('ind-pop', 'All', false);
    renderIndustryList();
    industry.loadOptions().then(() => {
      industryOptions = industry.options.map(o => String(typeof o === 'object' ? (o.value ?? o.label) : o));
      renderIndustryList();
    }).catch(e => console.error('[globe] industry options', e));

    // Theme: the OS setting, which the anfra host's own toggle also starts from. anfra 0.8.0 doesn't pass its toggle
    // into the frame (no message, no SDK field, and the frame's media query ignores the host's color-scheme)
    const osDark = matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() {
      document.documentElement.classList.toggle('dark', osDark.matches);
      recolorMap(); render();
    }
    osDark.addEventListener('change', applyTheme);
    applyTheme();

    // ---------------------------------------------------------------- data lifecycle
    const indexed = {};
    const logged = new Set();
    function onData() {
      const qs = Object.entries(Q);
      const failed = qs.find(([, q]) => q.state === 'error');
      if (failed) { setStatus(`Could not load ${failed[0]}: ${failed[1].error?.message}`, 'error'); console.error('[globe]', failed[0], failed[1].error); return; }
      let changed = false, themesChanged = false;
      for (const [name, q] of qs) {
        if (q.state !== 'success' || indexed[name] === q.result) continue;
        if (q.setId) INDEX[q.level](q.result.rows, q.setId);
        else INDEX[name](q.result.rows);
        indexed[name] = q.result;
        if (['themes', 'themes_by_country', 'quotes'].includes(name)) themesChanged = true; else changed = true;
        const tag = q.level || name;
        if (!logged.has(tag)) { logged.add(tag);
          console.log(`[globe] ${name}`, q.result.rows.length, 'rows', q.result.columns.map(c => c.name), q.result.rows[0], q.result.debug?.executedAql); }
      }
      if (D.asOf && D.asOf !== st.asOf) return applyRange(); // meta brought a cut-off other than the hint
      // (declaring a slice's queries calls back here before the slice is registered: not loaded yet)
      const sq = sets.get(st.view), view = [Q.meta, Q.markets, ...Object.values(sq || {})];
      const loading = !sq || [...wanted].some(l => !sq[l]) || view.some(q => q.state === 'executing' || !q.result);
      const stale = loading && Object.keys(D.markets).length > 0; // numbers on screen, new ones on the way
      // Only a level just opened is on its way (the reader drilled into the US or a market): the rest stays current
      const pending = view.filter(q => q.state === 'executing' || !q.result).map(q => q.level);
      const drilling = stale && pending.length > 0 && pending.every(l => l === 'states' || l === 'cities');
      $('.app').classList.toggle('busy', stale && !drilling); $('#side').ariaBusy = String(stale);
      setStatus(loading ? (drilling ? (pending.includes('cities') ? 'Loading cities…' : 'Loading US states…') : stale ? 'Updating…' : 'Loading data…') : mapReady ? '' : 'Loading map…', loading ? 'busy' : '');
      if (!loading && !(num(D.world[st.view]?.customers) > 0)) setStatus(st.industry ? `No customers in ${st.industry} by ${fDay(viewSlice().to, true)}.` : 'No customers in this range.', 'error');
      const themeQs = [Q.themes, Q.themes_by_country, Q.quotes];
      if (themeQs[0]) TH.ready = themeQs.every(q => q.state === 'success' && q.result);
      if (changed && !loading) { showRange(); render(); }
      else if (themesChanged && TH.ready) { renderSide(); lensChanged(); }
      renderSvs();
      // No prefetch: the review tabs (setMetric 'rating') and Size vs strength (setPage) each
      // declare their queries when first opened, so a visit to the Overview runs only the Overview's.
      if (!loading && mapReady && !onData.ready) { onData.ready = true; console.log('[globe] ready'); }
    }
    app.subscribe(onData);
    D.asOf = AS_OF_HINT; // the default range from the hint: its queries run together with meta (INDEX.meta then sets the real one)
    applyRange();
  </script>
</body>
</html>
